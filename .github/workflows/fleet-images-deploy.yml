# .github/workflows/fleet-images-deploy.yml
#
# Build + push every fleet binary (22 services/workers + migrator +
# topic-provisioner) to ECR — one image per binary, one multi-arch manifest per
# binary. Add a binary to FLEET_BINS below to ship a new one (see its comment).
#
# ── Shape: ONE build job per architecture, not one per (binary, arch) ─────────
# The 24 binaries share almost the whole dependency graph AND the workspace
# crates (foundation / platform / storage / service). Compiling them in one
# `cargo build` per arch compiles that shared graph ONCE instead of 24 times,
# and keeps the run under GitHub's 20-concurrent-job cap (the previous 44-job
# matrix ran in three waves). Compiled artifacts are cached runner-side with
# Swatinem/rust-cache (GitHub Actions cache, free on this public repo), so a
# push only recompiles the crates it touched and their dependents.
#
# The compile runs INSIDE the Dockerfile's `toolchain` stage (rust + protoc +
# cmake on Debian bookworm), with the checkout and the cargo cache bind-mounted
# — not on the runner's own userland. A binary needs at runtime a glibc at least
# as new as the one it was BUILT against; the runner (Ubuntu 24.04, glibc 2.39)
# produced binaries that died in the bookworm runtime image (glibc 2.36) with
# "GLIBC_2.38 not found" (2026-09-15 staging cycle). A gate below re-checks it.
#
# Images are then produced WITHOUT compiling inside Docker: deploy/docker-bake.hcl
# builds only the Dockerfile's `runtime` stage for each binary, overriding the
# `builder` stage with a local dir holding the prebuilt binary (a BuildKit named
# context). The Dockerfile's own cargo-chef route is unchanged and stays the
# local / docker-compose path (`docker build --build-arg BIN=…`).
#
# Why no registry-side build cache: the previous per-(bin,arch) BuildKit cache
# on ECR cost 83.55 USD of DataTransfer-Out in July 2026 (1,028 GB — ~40 GB and
# ~4 USD per push to develop), and even moved to GHCR (#638) it could only cache
# third-party crates. This layout needs no registry cache at all: ECR only ever
# receives image pushes (ingress is free).
#
# Auth + region come from the same repo secrets the other deploy workflows use
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION).
#
# Each image is tagged with the immutable :<git-sha> (the deployment handle) and a
# floating :staging (convenience only). After BOTH arches succeed, the
# `pin-staging-images` job rewrites the staging overlay's fleet image tags to that
# :<git-sha> and commits to arnaudmaillet/core-platform-infra@develop (the GitOps
# repo ArgoCD tracks; this repo's develop never receives bot commits) — so ArgoCD
# sees a real manifest diff and
# rolls out, deploys are content-addressed (IfNotPresent is correct for an
# immutable tag), and a rollback is just `git revert`.
name: Build & Push Fleet Images

on:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/Dockerfile'
      - 'deploy/docker-bake.hcl'
      - '.github/workflows/fleet-images-deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (default: staging)'
        default: staging

permissions:
  contents: read

env:
  # THE list of fleet binaries this workflow ships. Package name == binary name
  # == crates/apps/<name> == ECR repo core-platform-<name>. Consumed by the cargo
  # build, the bake matrix, the stitch loop and the staging pin — one source.
  # Adding a binary: FIRST, in arnaudmaillet/core-platform-infra, add its ECR repo
  # (infrastructure/live/global/artifacts/ecr — and APPLY it: ECR does not
  # auto-create repos, the push would fail) and its overlays' `images:` entry (so
  # the pin job can rewrite its tag); THEN add it here.
  FLEET_BINS: >-
    counter-server counter-worker audit-server audit-worker
    auth-server media-server media-worker moderation-server search-server
    realtime-gateway realtime-dispatcher
    account-server chat-server comment-server engagement-server
    geo-discovery-server notification-server post-server profile-server
    social-graph-server timeline-server
    wallet-server
    migrator topic-provisioner

jobs:
  build-and-push:
    name: Build fleet (${{ matrix.arch.suffix }})
    # Native runner per arch — no QEMU: emulated rustc on this workspace is
    # hours territory, while ubuntu-24.04-arm is free on public repos and
    # compiles at full speed. Each arch pushes arch-suffixed tags; the stitch
    # job below merges them into one multi-arch manifest per binary.
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest,     suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm,  suffix: arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Runner-side compile cache (GitHub Actions cache). One key per arch —
      # artifacts are not portable across targets. cache-workspace-crates keeps
      # OUR crates' artifacts too (not only third-party), so a push recompiles
      # just the crates it touched and their dependents. Saved only from develop
      # so a manual dispatch on a branch cannot poison it. Budget: the repo cache
      # cap is 10 GB shared with ci.yml — watch `gh cache list`; if the two
      # release caches crowd it out, flip cache-workspace-crates to false
      # (deps-only, the cargo-chef `cook` equivalent). The key names the build
      # environment: artifacts compiled on the runner's own userland must never
      # be reused by the bookworm toolchain (native objects embed glibc symbols).
      # rust-cache needs a host rustc for its cache key (the compile itself runs
      # in the container). RUSTUP_TOOLCHAIN=stable keeps the rustup shim from
      # honoring rust-toolchain.toml here, which would download the pinned
      # toolchain on the host on every run just to print a version.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          key: fleet-release-bookworm-${{ matrix.arch.suffix }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # The compile environment IS the Dockerfile's `toolchain` stage: same Debian
      # release (glibc) as the `runtime` stage, same protoc/cmake, same rust pin.
      # The stage copies nothing from the context, so `deploy/` (tiny) is enough.
      - name: Build the toolchain image (deploy/Dockerfile --target toolchain)
        run: docker build -f deploy/Dockerfile --target toolchain -t fleet-toolchain deploy

      # Checkout + cargo registry/git caches are bind-mounted so rust-cache keeps
      # working on the host; the container runs as root, hence the chown below
      # (rust-cache's post step prunes target/ as the runner user).
      - name: Build every fleet binary (release, inside the toolchain image)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          # shellcheck disable=SC2086
          docker run --rm \
            -v "$PWD:/app" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /app fleet-toolchain \
            cargo build --release --locked $(printf -- '-p %s ' $FLEET_BINS)
          sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo"

      # Gate: the newest GLIBC_x.y symbol a binary references must not exceed the
      # runtime base's glibc, or the image dies at exec. Reads the runtime base
      # from the Dockerfile so the two never drift apart silently.
      - name: Gate — binaries must run on the runtime image's glibc
        run: |
          set -euo pipefail
          runtime_base=$(grep -oE '^FROM [^ ]+ AS runtime' deploy/Dockerfile | awk '{print $2}')
          # Capture the whole `ldd --version` output BEFORE parsing it. Piping the
          # streaming `docker run` straight into `head -1` closed the pipe while
          # docker was still writing ("write /dev/stdout: broken pipe"), which under
          # pipefail failed this step at random — the amd64 build of 2026-09-15
          # (arm64 passed the very same step). sed reads all of its input, so the
          # writer never sees EPIPE.
          runtime_ldd=$(docker run --rm "$runtime_base" ldd --version)
          runtime_glibc=$(printf '%s\n' "$runtime_ldd" | sed -n '1s/.*[[:space:]]\([0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')
          if [ -z "$runtime_glibc" ]; then
            echo "::error::could not read the runtime image's glibc version from: $runtime_ldd"
            exit 1
          fi
          echo "runtime base $runtime_base -> glibc $runtime_glibc"
          fail=0
          for bin in $FLEET_BINS; do
            need=$(strings -a "target/release/$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
            newest=$(printf '%s\n%s\n' "$need" "$runtime_glibc" | sort -V | tail -1)
            if [ "$newest" != "$runtime_glibc" ]; then
              echo "::error::$bin references GLIBC_$need but the runtime image only has glibc $runtime_glibc"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          echo "all binaries need glibc <= $runtime_glibc"

      # One named-context dir per binary, laid out as the Dockerfile's builder
      # stage would have left it (/usr/local/bin/app) so `COPY --from=builder`
      # resolves unchanged. Only the binaries reach BuildKit — never target/.
      - name: Stage binaries for packaging
        run: |
          set -euo pipefail
          for bin in $FLEET_BINS; do
            install -D -m 0755 "target/release/$bin" "dist/$bin/usr/local/bin/app"
          done
          du -sh dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # All fleet images in ONE BuildKit session (see deploy/docker-bake.hcl):
      # the shared runtime layers are built once; each image is a COPY of its
      # binary, then pushed as :<sha>-<arch>.
      - name: Package and push images (${{ matrix.arch.suffix }})
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch.suffix }}
          PLATFORM: ${{ matrix.arch.platform }}
        run: docker buildx bake -f deploy/docker-bake.hcl --push

  # ── Stitch per-arch images into one multi-arch manifest per binary ───────────
  # The :<git-sha> and floating tags only exist once BOTH arch builds succeeded
  # (needs: gates on the full matrix) — a half-arch fleet is never addressable
  # by the tags the infra overlays and its promote workflow use. This is what lets
  # the Karpenter pools re-allow arm64: kubelet resolves the right arch from
  # the manifest list.
  stitch-manifests:
    name: Create multi-arch manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Stitch and verify every binary
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.inputs.tag || 'staging' }}
        run: |
          set -euo pipefail
          # imagetools has failed twice with a bare exit-255 immediately AFTER a
          # successful manifest push (runs 28727067443, 28728911748) — transient
          # registry/transport flake, both times fixed by a plain rerun. Bounded
          # retries beat re-running the whole workflow to re-execute one command.
          retry() {
            local attempt=1
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "FAILED after 3 attempts: $*" >&2
                return 1
              fi
              echo "attempt $attempt/3 after transient failure: $*" >&2
              sleep 10
            done
          }
          for bin in $FLEET_BINS; do
            retry docker buildx imagetools create \
              -t "$REG/core-platform-$bin:${{ github.sha }}" \
              -t "$REG/core-platform-$bin:$TAG" \
              "$REG/core-platform-$bin:${{ github.sha }}-amd64" \
              "$REG/core-platform-$bin:${{ github.sha }}-arm64"
            # Fail loudly if the stitched manifest is missing either platform.
            retry sh -c "docker buildx imagetools inspect '$REG/core-platform-$bin:${{ github.sha }}' | grep -q 'linux/amd64'"
            retry sh -c "docker buildx imagetools inspect '$REG/core-platform-$bin:${{ github.sha }}' | grep -q 'linux/arm64'"
            echo "stitched: $bin"
          done

  # ── Pin the staging overlay to the immutable tag we just built ────────────────
  # Runs once after BOTH arch builds + the stitch succeed; if anything fails, the
  # fleet is not pinned (a partial rollout is never promoted). Rewrites ONLY the
  # images this workflow builds, in the GitOps repo
  # (arnaudmaillet/core-platform-infra, k8s/overlays/staging), and commits to its
  # develop so ArgoCD rolls out the new revision.
  pin-staging-images:
    name: Pin staging overlay (core-platform-infra) to immutable tags
    needs: stitch-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only auto-pin for the standard staging build (skip manual one-off tags).
    if: ${{ github.event_name == 'push' || (github.event.inputs.tag || 'staging') == 'staging' }}
    # Two develop pushes in a row must not race on the same overlay file.
    concurrency:
      group: infra-staging-pin
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout core-platform-infra@develop
        uses: actions/checkout@v4
        with:
          repository: arnaudmaillet/core-platform-infra
          ref: develop
          fetch-depth: 0
          # Push over SSH with the infra repo's `fleet-pin` deploy key (write):
          # its develop ruleset requires PRs but grants DeployKey bypass, so this
          # job (and only a holder of this key) may land the sha-pin commit
          # directly. A GITHUB_TOKEN can't reach another repo, and GitHub can't
          # grant the Actions app a ruleset bypass on user-owned repos anyway.
          ssh-key: ${{ secrets.PLATFORM_PIN_DEPLOY_KEY }}

      - name: Pin fleet images to the built commit SHA
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for bin in $FLEET_BINS; do
            NAME="core-platform-$bin" NEWTAG="$TAG" \
              yq -i '(.images[] | select(.name == strenv(NAME)).newTag) = strenv(NEWTAG)' \
              k8s/overlays/staging/kustomization.yaml
          done

      - name: Commit & push
        env:
          TAG: ${{ github.sha }}
          SOURCE: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- k8s/overlays/staging/kustomization.yaml; then
            echo "Fleet images already pinned to ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "chore(deploy): pin staging fleet images to ${TAG} [skip ci]" \
                     -m "Built from ${SOURCE}@${TAG}."
          # Rebase in case infra develop advanced while the fleet was building.
          git pull --rebase origin develop
          git push origin develop
