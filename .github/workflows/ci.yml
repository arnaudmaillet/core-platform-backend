# .github/workflows/ci.yml
#
# The workspace-wide test + lint gate. Until this existed, NO workflow ran
# `cargo test --workspace` — PR CI covered only protos (buf), the event
# topology, and i18n drift, all path-filtered; the fleet image build was the
# sole (post-merge) compile proof. Found in the 2026-07-04 production-readiness
# audit.
#
# Integration tests are feature-gated (`integration-<svc>`, need Docker
# backends) and deliberately NOT run here — the default feature set is
# unit-only. See docs: the k6 staging soak is the live-backend exercise.
#
# Build deps mirror deploy/Dockerfile: protoc + well-known types for the
# `*-api` crates' tonic codegen; cmake/zlib for the bundled librdkafka.
# Debuginfo is disabled to keep the build inside the runner's disk budget
# (the full-debug workspace target tree exceeds it).
#
# The PR gate (#828). Every PR to any branch runs this workflow, whatever it
# touches, and gets one always-reporting check, `ci-ok`, that branch rules can
# require: the path filtering lives in the `changes` job instead of the
# trigger (a required check whose workflow is path-filtered out never
# reports, and stays pending forever). `ci-ok` is green when every job the PR
# needed passed, a skipped one counting as passed; red if any failed or was
# cancelled. A new `integration` matrix entry is covered without touching the
# rules.
#
# The contracts, i18n-drift and event-catalog checks run here on PRs, as
# reusable workflows; those files keep their own push triggers (BSR publish,
# drift and topology on develop/main).
name: ci

on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'rust-toolchain.toml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Registry hiccups are not the PR's fault (2026-10-04: a crates.io index
  # fetch hit `curl [28] Connection timed out after 30002 ms` and failed an
  # integration job). Defaults are 3 retries / 30 s; widen both. The explicit
  # `cargo fetch` step below also takes the download off the build step.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "60"

jobs:
  # Which checks this change needs. On a push the trigger's paths already
  # filtered for Rust, and the other checks run from their own workflows.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust:     ${{ steps.filter.outputs.rust }}
      proto:    ${{ steps.filter.outputs.proto }}
      docs:     ${{ steps.filter.outputs.docs }}
      topology: ${{ steps.filter.outputs.topology }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE:  ${{ github.event.pull_request.base.sha }}
          HEAD:  ${{ github.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'rust=true\nproto=false\ndocs=false\ntopology=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          printf '%s\n' "$files"
          # A change to this workflow runs every check.
          match() { printf '%s\n' "$files" | grep -qE "$1|^\.github/workflows/ci\.yml$" && echo true || echo false; }
          {
            echo "rust=$(match '^crates/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$')"
            echo "proto=$(match '^crates/contracts/proto/|^\.github/workflows/contracts\.yml$')"
            echo "docs=$(match '\.md$|^tools/i18n/|^\.github/workflows/i18n-drift\.yml$')"
            echo "topology=$(match '^crates/contracts/event-topology/|^docs/domain/EVENT_CATALOG(\.fr)?\.md$|^tools/event-catalog/|^\.github/workflows/event-catalog\.yml$')"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build deps (protoc, librdkafka toolchain)
        # A stalled mirror must fail a request (30 s), so apt's retries move on,
        # and the step must fail fast if it still hangs (a re-run fixes it).
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends protobuf-compiler libprotobuf-dev cmake zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fetch (retried)
        run: for i in 1 2 3; do cargo fetch --locked && exit 0; echo "::warning::cargo fetch failed (attempt $i/3)"; sleep $((i * 15)); done; exit 1
      - name: cargo test --workspace
        run: cargo test --workspace --locked --quiet

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build deps (protoc, librdkafka toolchain)
        # A stalled mirror must fail a request (30 s), so apt's retries move on,
        # and the step must fail fast if it still hangs (a re-run fixes it).
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends protobuf-compiler libprotobuf-dev cmake zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fetch (retried)
        run: for i in 1 2 3; do cargo fetch --locked && exit 0; echo "::warning::cargo fetch failed (attempt $i/3)"; sleep $((i * 15)); done; exit 1
      # Bare -D warnings: the tree was clippy-cleaned 2026-07-05 (53 sites —
      # auto-fixes, real refactors, and documented targeted #[allow]s for the
      # structural lints). Keep it clean; add targeted allows in code, not here.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ── Live-backend integration suites ──────────────────────────────────────────
  # Every feature-gated `integration-<name>` suite, against real containers
  # (test-support boots Postgres/Scylla/Redis/Kafka/OpenSearch/MinIO via
  # testcontainers). These NOT running in CI hid three production bugs that the
  # 2026-07-05 Keycloak E2E drill had to find the hard way (account INT2 decode,
  # inverted optimistic CAS, auth's missing Kafka env) — and earlier, six of the
  # staging soak's eighteen findings. Public repo ⇒ runner minutes are free; the
  # matrix parallelizes so wall time ≈ the slowest (Scylla-backed) suite.
  integration:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { pkg: account,        feature: integration-account }
          - { pkg: audit,          feature: integration-audit }
          - { pkg: auth,           feature: integration-auth }
          - { pkg: chat,           feature: integration-chat }
          - { pkg: comment,        feature: integration-comment }
          - { pkg: counter,        feature: integration-counter }
          - { pkg: engagement,     feature: integration-engagement }
          - { pkg: geo-discovery,  feature: integration-geo-discovery }
          - { pkg: media,          feature: integration-media }
          - { pkg: moderation,     feature: integration-moderation }
          - { pkg: notification,   feature: integration-notification }
          - { pkg: post,           feature: integration-post }
          - { pkg: profile,        feature: integration-profile }
          - { pkg: realtime,       feature: integration-realtime }
          - { pkg: search,         feature: integration-search }
          - { pkg: social-graph,   feature: integration-social-graph }
          - { pkg: timeline,       feature: integration-timeline }
          - { pkg: wallet,         feature: integration-wallet }
          - { pkg: postgres,       feature: integration-postgres }
          - { pkg: traffic-redis,  feature: integration-traffic-redis }
          - { pkg: transport,      feature: integration-kafka }
    steps:
      - uses: actions/checkout@v4
      - name: Build deps (protoc, librdkafka toolchain)
        # A stalled mirror must fail a request (30 s), so apt's retries move on,
        # and the step must fail fast if it still hangs (a re-run fixes it).
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends protobuf-compiler libprotobuf-dev cmake zlib1g-dev
      # OpenSearch containers refuse to start below this (search/media suites).
      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache shared across the matrix (first finisher saves; the rest
          # restore) — the compiled dep graph is common to every suite.
          shared-key: integration
      - name: cargo fetch (retried)
        run: for i in 1 2 3; do cargo fetch --locked && exit 0; echo "::warning::cargo fetch failed (attempt $i/3)"; sleep $((i * 15)); done; exit 1
      # The postgres storage suite predates test-support's containers: it
      # expects an externally supplied DATABASE_URL (the #545 gating). Give it
      # one; every other suite boots its own backends.
      - name: Provide DATABASE_URL for the raw postgres suite
        if: matrix.suite.pkg == 'postgres'
        run: |
          for i in 1 2 3 4; do docker pull --quiet postgres:16 && break; [ "$i" = 4 ] && exit 1; sleep $((i * 5)); done
          docker run -d --name ci-pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:16
          for i in $(seq 1 30); do docker exec ci-pg pg_isready -U postgres && break; sleep 1; done
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"
      # Backend images are pulled by test-support itself, with retries
      # (`containers::ensure_image`): the list is whatever the suite boots, so
      # there is no second image list to keep in sync here.
      - name: cargo test -p ${{ matrix.suite.pkg }} --features ${{ matrix.suite.feature }}
        run: cargo test -p ${{ matrix.suite.pkg }} --features ${{ matrix.suite.feature }} --locked

  # ── The other PR checks, as reusable workflows ────────────────────────────
  buf:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.proto == 'true'
    permissions:
      contents: read
      # buf-action posts a lint/breaking summary comment on the PR.
      pull-requests: write
    uses: ./.github/workflows/contracts.yml
    secrets: inherit

  drift:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/i18n-drift.yml

  topology:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.topology == 'true'
    uses: ./.github/workflows/event-catalog.yml

  # ── The one required check ────────────────────────────────────────────────
  ci-ok:
    needs: [changes, test, clippy, integration, buf, drift, topology]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
