syntax = "proto3";

package account.v1;

import "account/v1/messages.proto";

option java_package = "com.coreplatform.account.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/account/v1;accountv1";

// AccountService manages the full private lifecycle of a physical person:
// registration, credential management, KYC, GDPR compliance, and role-based
// access control. Financial state is owned by the dedicated ledger microservice.
//
// All mutating RPCs (commands) return CommandResponse.
// All read RPCs (queries) return the typed view message.
//
// Callers must supply a valid JWT bearer token; the service validates the
// token and populates the request principal from the auth-context crate.
service AccountService {

    // ── Registration & identity ───────────────────────────────────────────────

    // Register a new account. Idempotent on (identity_id, email) uniqueness.
    rpc CreateAccount(CreateAccountRequest) returns (CommandResponse);

    // Mark the account's email address as verified. Mesh only: auth calls it
    // after the holder proved the address (a verified id_token or a one-time code).
    rpc VerifyEmail(VerifyEmailRequest) returns (CommandResponse);

    // Mark the account's phone number as verified. Mesh only: auth calls it
    // after the holder proved the number (a one-time SMS code).
    rpc VerifyPhone(VerifyPhoneRequest) returns (CommandResponse);

    // Replace the account's email / phone with one its holder just proved
    // (#651): set and verified at once. Mesh only: auth calls them after a
    // one-time code sent to the new address. Another account's address:
    // ACC-1003 / ACC-1004.
    rpc ChangeEmail(ChangeEmailRequest) returns (CommandResponse);
    rpc ChangePhone(ChangePhoneRequest) returns (CommandResponse);

    // ── Credentials ───────────────────────────────────────────────────────────

    // Replace the stored Argon2id password hash.
    rpc ChangePassword(ChangePasswordRequest) returns (CommandResponse);

    // ── MFA ───────────────────────────────────────────────────────────────────

    // MFA is auth's (#649): it encrypts the TOTP seed, hashes the backup codes
    // and checks them; account only keeps them. Every MFA RPC is mesh only —
    // the holder enrolls and disables through auth, after a step-up.

    // Store an encrypted TOTP seed and its backup codes: MFA is on (ACC-5001
    // when it already is).
    rpc EnrollMfa(EnrollMfaRequest) returns (CommandResponse);

    // Remove all MFA credentials and deactivate MFA enforcement.
    rpc RevokeMfa(RevokeMfaRequest) returns (CommandResponse);

    // The encrypted seed and how many backup codes are left, for auth to check
    // a code. Never on the edge.
    rpc GetMfaSecret(GetMfaSecretRequest) returns (MfaSecretView);

    // Spend one backup code (by its hash): it works once. ACC-5003 when no
    // unused code has that hash, ACC-5002 when MFA is off.
    rpc ConsumeRecoveryCode(ConsumeRecoveryCodeRequest) returns (CommandResponse);

    // Replace every backup code with a new set (the holder regenerated them).
    rpc ReplaceRecoveryCodes(ReplaceRecoveryCodesRequest) returns (CommandResponse);

    // ── KYC ───────────────────────────────────────────────────────────────────

    // Update the KYC verification outcome (admin / compliance officer only).
    rpc UpdateKycStatus(UpdateKycStatusRequest) returns (CommandResponse);

    // ── Lifecycle ─────────────────────────────────────────────────────────────

    // Suspend an account (admin action). Reversible via ReactivateAccount.
    rpc SuspendAccount(SuspendAccountRequest) returns (CommandResponse);

    // Lift a suspension and return the account to Active status.
    rpc ReactivateAccount(ReactivateAccountRequest) returns (CommandResponse);

    // User-initiated self-deactivation: the account's profiles are hidden until
    // the holder signs back in (see ResumeDeactivatedAccount). Data is retained
    // per retention policy. Refused on a suspended account.
    rpc DeactivateAccount(DeactivateAccountRequest) returns (CommandResponse);

    // Return a self-deactivated account to Active because its holder signed
    // back in (called by auth on Login; mesh only). Succeeds as a no-op on an
    // account that is already Active; FAILED_PRECONDITION on any other status —
    // a suspension is lifted only by ReactivateAccount.
    rpc ResumeDeactivatedAccount(ResumeDeactivatedAccountRequest) returns (CommandResponse);

    // ── Session tracking ──────────────────────────────────────────────────────

    // Record a successful login; resets failed_login_attempts and updates last_login_at.
    rpc RecordLogin(RecordLoginRequest) returns (CommandResponse);

    // Increment failed_login_attempts; may set locked_until if threshold reached.
    rpc RecordFailedLogin(RecordFailedLoginRequest) returns (CommandResponse);

    // Record the holder's date of birth when none is on file (accounts created
    // before it was collected). On the client edge, the caller's own only.
    rpc SetDateOfBirth(SetDateOfBirthRequest) returns (AccountView);

    // ── GDPR / compliance ─────────────────────────────────────────────────────

    // Initiate an Art. 17 GDPR right-to-erasure request. The account is erased
    // (anonymized, its audit PII crypto-shredded) 30 days later by the janitor;
    // meanwhile an active account is deactivated (profiles hidden, sessions end
    // at their next refresh) and signing back in cancels the request.
    rpc RequestGdprDeletion(RequestGdprDeletionRequest) returns (CommandResponse);

    // Withdraw a pending erasure within its grace period (before
    // deletion_scheduled_at): ACC-7003 if none is pending, ACC-7004 once the
    // period is over. Signing back in also cancels it (it resumes the account
    // the request deactivated). On the client edge, the caller's own only.
    rpc CancelGdprDeletion(CancelGdprDeletionRequest) returns (CommandResponse);

    // Anonymise all PII fields after the retention period has elapsed.
    rpc AnonymizeAccount(AnonymizeAccountRequest) returns (CommandResponse);

    // Initiate an Art. 20 GDPR data portability export.
    rpc RequestDataExport(RequestDataExportRequest) returns (CommandResponse);

    // ── Roles & permissions ───────────────────────────────────────────────────

    // Grant an internal platform role to the account (admin only).
    rpc AssignRole(AssignRoleRequest) returns (CommandResponse);

    // Remove an internal platform role from the account (admin only).
    rpc RevokeRole(RevokeRoleRequest) returns (CommandResponse);

    // ── Queries ───────────────────────────────────────────────────────────────

    // Fetch the full account aggregate view by primary key.
    rpc GetAccountById(GetAccountByIdRequest) returns (AccountView);

    // Fetch the full account aggregate view by IdP subject claim.
    rpc GetAccountByIdentityId(GetAccountByIdentityIdRequest) returns (AccountView);

    // Fetch the account holding an email address (case-insensitive). Mesh only:
    // auth's sign-up uses it to spot an account created with another method,
    // so a client can never enumerate addresses through it.
    rpc GetAccountByEmail(GetAccountByEmailRequest) returns (AccountView);

    // Fetch the account holding a phone number (E.164). Mesh only, like
    // GetAccountByEmail (auth's phone sign-up).
    rpc GetAccountByPhone(GetAccountByPhoneRequest) returns (AccountView);

    // Lightweight status check used by auth middleware and gateway.
    rpc GetAccountStatus(GetAccountStatusRequest) returns (AccountStatusView);

    // The GDPR record: consents, deletion and export state. On the client edge
    // an account reads its own only (account_id = the caller).
    rpc GetGdprRecord(GetGdprRecordRequest) returns (GdprRecordView);

    // Give or withdraw consents (GDPR Art. 7(3)); each effective change is
    // kept in a timestamped history. Returns the updated record. On the client
    // edge an account updates its own only.
    rpc UpdateConsents(UpdateConsentsRequest) returns (GdprRecordView);

    // Paginated list of accounts filtered by lifecycle status (admin / ops).
    rpc ListAccountsByStatus(ListAccountsByStatusRequest) returns (ListAccountsByStatusResponse);

    // Find the profiles of one's address book (#661): SHA-256 hashes of the
    // contacts' normalized email addresses (lower-cased, trimmed) and phone
    // numbers (E.164), at most 1000 per call; nothing of them is kept. A
    // contact matches an active account's verified email / phone, then its
    // active profiles that are findable that way (profile discovery
    // settings), never blocked either way, never the caller's own. Edge:
    // the caller's account.
    rpc FindProfilesByContacts(FindProfilesByContactsRequest) returns (FindProfilesByContactsResponse);

    // ── Family supervision (#670) ──────────────────────────────────────────
    // A parent (18+ by date of birth) pairs with a teen (13–17): either side
    // creates an invite, the other accepts it. Both always see the link;
    // either ends it; it ends by itself at 18. A teen has at most two
    // supervisors. Edge: the caller's account.

    // An invite code to share (shown or as a QR code): 10 characters, single
    // use, 24 hours. `role` is the caller's side. ACC-3002 when the caller's
    // age does not fit it (or is unknown).
    rpc CreateSupervisionInvite(CreateSupervisionInviteRequest) returns (SupervisionInviteView);

    // Accepts an invite: the caller takes the other side. ACC-3001 unknown,
    // used or expired code; ACC-3002 the caller's age does not fit;
    // ACC-3003 the teen already has two supervisors; ACC-3006 one's own code.
    rpc AcceptSupervisionInvite(AcceptSupervisionInviteRequest) returns (SupervisionView);

    // The caller's supervisions, both sides: its supervisors (as a teen) and
    // the teens it supervises.
    rpc ListSupervisions(ListSupervisionsRequest) returns (ListSupervisionsResponse);

    // Ends the caller's supervision with `other_account_id` (either side
    // may; the other is told) and returns those left. ACC-3005 when there is
    // none.
    rpc EndSupervision(EndSupervisionRequest) returns (ListSupervisionsResponse);
}
