syntax = "proto3";

package account.v1;

import "account/v1/enums.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.coreplatform.account.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/account/v1;accountv1";

// ── Read model views ──────────────────────────────────────────────────────────

// Full account view returned by GetAccountById and GetAccountByIdentityId.
message AccountView {
    string                          id                   = 1;
    string                          identity_id          = 2;
    AccountStatus                   status               = 3;
    string                          suspension_reason    = 4;
    string                          email                = 5;
    bool                            email_verified       = 6;
    string                          phone                = 7;
    bool                            phone_verified       = 8;
    KycStatus                       kyc_status           = 9;
    string                          country_of_residence = 10;
    repeated string                 roles                = 11;
    int64                           version              = 12;
    google.protobuf.Timestamp       created_at           = 13;
    google.protobuf.Timestamp       updated_at           = 14;
    // Effective fine-grained grants (role expansion ∪ permission_overrides),
    // e.g. audit:read — minted verbatim into edge tokens by auth. Additive:
    // absent on old servers, in which case callers fall back to roles only.
    repeated string                 permissions          = 15;
    // From the date of birth, today. 13–17 ⇒ teen protections (auth mints it
    // into the edge token's `age` claim).
    AgeBracket                      age_bracket          = 16;
    // ISO 8601 (YYYY-MM-DD); empty when none is on file. Private: the holder's
    // own view (edge) or the mesh.
    string                          date_of_birth        = 17;
    // Two-step sign-in is on (#649): a TOTP app, plus backup codes.
    bool                            mfa_enrolled         = 18;
    // Unused backup codes left (0 when MFA is off).
    int32                           mfa_recovery_codes_remaining = 19;
}

// The holder's MFA material, for auth only (mesh): never on the edge.
message MfaSecretView {
    string  account_id               = 1;
    bool    enrolled                 = 2;
    // auth's ciphertext of the TOTP seed (empty when not enrolled).
    bytes   totp_secret              = 3;
    int32   recovery_codes_remaining = 4;
}

// GDPR record: the holder's own (client edge, account_id = the caller) or any
// account's (mesh, compliance). A consent is given while its `_consented_at`
// is set.
message GdprRecordView {
    string                          account_id                       = 1;
    bool                            data_processing_consented        = 2;
    bool                            marketing_consented              = 3;
    google.protobuf.Timestamp       deletion_requested_at            = 4;
    google.protobuf.Timestamp       anonymized_at                    = 5;
    google.protobuf.Timestamp       data_export_requested_at         = 6;
    google.protobuf.Timestamp       data_export_completed_at         = 7;
    // When a requested deletion becomes permanent (the end of the grace period).
    google.protobuf.Timestamp       deletion_scheduled_at            = 8;
    bool                            analytics_consented              = 9;
    // The privacy-policy version the holder last consented under.
    string                          consent_policy_version           = 10;
    google.protobuf.Timestamp       data_processing_consented_at     = 11;
    google.protobuf.Timestamp       marketing_consented_at           = 12;
    google.protobuf.Timestamp       analytics_consented_at           = 13;
    // The delivered data export (#653): its download link (a ZIP; a credential
    // — show it to the holder only) and when it stops working (7 days). Empty
    // while none is delivered, or a newer request is pending.
    string                          data_export_url                  = 14;
    google.protobuf.Timestamp       data_export_expires_at           = 15;
}

// Minimal status-only view used by auth and gateway services.
message AccountStatusView {
    string          account_id          = 1;
    AccountStatus   status              = 2;
    string          suspension_reason   = 3;
}

// Generic command acknowledgement.
message CommandResponse {
    bool    success     = 1;
    string  account_id  = 2;
}

// ── Command request messages ──────────────────────────────────────────────────

message CreateAccountRequest {
    string  identity_id          = 1;
    string  email                = 2;
    string  phone                = 3;
    // Pre-hashed credential. The service NEVER accepts plaintext passwords.
    string  password_hash        = 4;
    string  country_of_residence = 5;
    // UUID of the admin account that created this account; empty for self-registration.
    string  created_by           = 6;
    // ISO 8601 (YYYY-MM-DD). Under the minimum age (13; 16 where the country of
    // residence requires it) the account is refused (ACC-2004).
    string  date_of_birth        = 7;
}

// Record the holder's date of birth when none is on file (once; afterwards
// only support can change it). Under the minimum age: ACC-2004, nothing stored.
message SetDateOfBirthRequest {
    string  account_id     = 1;
    string  date_of_birth  = 2;
}

message VerifyEmailRequest {
    string account_id = 1;
}

message VerifyPhoneRequest {
    string account_id = 1;
}

message ChangeEmailRequest {
    string account_id = 1;
    string email      = 2;
}

message ChangePhoneRequest {
    string account_id = 1;
    // E.164 (e.g. +33612345678).
    string phone      = 2;
}

message ChangePasswordRequest {
    string account_id       = 1;
    // New Argon2id hash — plaintext must never cross the gRPC boundary.
    string new_password_hash = 2;
}

message EnrollMfaRequest {
    string  account_id   = 1;
    // AES-256-GCM encrypted TOTP seed bytes (auth's key; account never reads it).
    bytes   totp_secret  = 2;
    // A hash of each one-time backup code (at least 6), as auth computes it:
    // account matches them exactly and never sees a code.
    repeated string recovery_code_hashes = 3;
}

message GetMfaSecretRequest {
    string account_id = 1;
}

message ConsumeRecoveryCodeRequest {
    string account_id = 1;
    string code_hash  = 2;
}

message ReplaceRecoveryCodesRequest {
    string          account_id           = 1;
    // At least 6, as for EnrollMfa.
    repeated string recovery_code_hashes = 2;
}

message RevokeMfaRequest {
    string account_id = 1;
}

message UpdateKycStatusRequest {
    string      account_id   = 1;
    KycStatus   kyc_status   = 2;
    // UUID of the admin account performing the review.
    string      reviewer_id  = 3;
}

message SuspendAccountRequest {
    string  account_id  = 1;
    string  reason      = 2;
}

message ReactivateAccountRequest {
    string account_id = 1;
}

message DeactivateAccountRequest {
    string account_id = 1;
}

message ResumeDeactivatedAccountRequest {
    string account_id = 1;
}

message RecordLoginRequest {
    string account_id = 1;
}

message RecordFailedLoginRequest {
    string account_id = 1;
}

message RequestGdprDeletionRequest {
    string account_id = 1;
}

message CancelGdprDeletionRequest {
    string account_id = 1;
}

message AnonymizeAccountRequest {
    string account_id = 1;
}

message RequestDataExportRequest {
    string account_id = 1;
}

message AssignRoleRequest {
    string       account_id = 1;
    AccountRole  role       = 2;
}

message RevokeRoleRequest {
    string       account_id = 1;
    AccountRole  role       = 2;
}

// ── Query request messages ────────────────────────────────────────────────────

message GetAccountByIdRequest {
    string account_id = 1;
}

message GetAccountByIdentityIdRequest {
    string identity_id = 1;
}

message GetAccountByEmailRequest {
    string email = 1;
}

message GetAccountByPhoneRequest {
    // E.164 (e.g. +33612345678).
    string phone = 1;
}

message GetAccountStatusRequest {
    string account_id = 1;
}

message GetGdprRecordRequest {
    string account_id = 1;
}

// Give or withdraw consents. An unset field leaves that purpose unchanged.
message UpdateConsentsRequest {
    string          account_id       = 1;
    optional bool   data_processing  = 2;
    optional bool   marketing        = 3;
    optional bool   analytics        = 4;
    // The privacy-policy version shown to the holder (≤ 64 chars), if any.
    string          policy_version   = 5;
}

message ListAccountsByStatusRequest {
    AccountStatus   status  = 1;
    int32           limit   = 2;
    int32           offset  = 3;
}

message ListAccountsByStatusResponse {
    repeated AccountView    accounts    = 1;
    int64                   total       = 2;
}

// ── Contact matching (#661) ───────────────────────────────────────────────────

message FindProfilesByContactsRequest {
    string         account_id   = 1;
    // SHA-256 (32 bytes) of each lower-cased, trimmed email address.
    repeated bytes email_sha256 = 2;
    // SHA-256 (32 bytes) of each E.164 phone number (e.g. "+33612345678").
    repeated bytes phone_sha256 = 3;
}

// A profile found through one of the caller's contacts.
message ContactProfile {
    // The hash the app sent, so it can name the contact.
    bytes          contact_sha256 = 1;
    ContactChannel channel        = 2;
    string         profile_id     = 3;
    string         handle         = 4;
    string         display_name   = 5;
    string         avatar_url     = 6;
}

message FindProfilesByContactsResponse {
    repeated ContactProfile profiles = 1;
}

// ── Family supervision (#670) ────────────────────────────────────────────────

message CreateSupervisionInviteRequest {
    string          account_id = 1;
    // The caller's side.
    SupervisionRole role       = 2;
}

message SupervisionInviteView {
    // 10 characters (Crockford base32); typing is case-insensitive and
    // ignores spaces and dashes.
    string                    code       = 1;
    google.protobuf.Timestamp expires_at = 2;
}

message AcceptSupervisionInviteRequest {
    string account_id = 1;
    string code       = 2;
}

// A profile of the other side, to show who it is.
message SupervisionProfile {
    string profile_id   = 1;
    string handle       = 2;
    string display_name = 3;
    string avatar_url   = 4;
}

// A supervision as the caller sees it: the other side.
message SupervisionView {
    // The other side's role: TEEN in a supervisor's list.
    SupervisionRole             other_role       = 1;
    string                      other_account_id = 2;
    google.protobuf.Timestamp   since            = 3;
    repeated SupervisionProfile profiles         = 4;
}

message ListSupervisionsRequest {
    string account_id = 1;
}

message ListSupervisionsResponse {
    // Most recent first.
    repeated SupervisionView supervisions = 1;
}

message EndSupervisionRequest {
    string account_id       = 1;
    string other_account_id = 2;
}

message SupervisionLimits {
    // The teen's profiles stay private.
    bool          private_account    = 1;
    // The loosest audience allowed for messages / comments.
    AudienceFloor messages           = 2;
    AudienceFloor comments           = 3;
    // Hidden from handle search, suggestions and contact matching (a shared
    // QR code or link still works).
    bool          hidden_from_search = 4;
    // Daily time on the app, 15–1440 minutes; 0: no daily limit.
    uint32        daily_minutes      = 5;
}

message SupervisionLimitsView {
    // false: no limits (the other fields are empty).
    bool                      set               = 1;
    SupervisionLimits         limits            = 2;
    // The supervisor who made the last change.
    string                    set_by_account_id = 3;
    google.protobuf.Timestamp set_at            = 4;
}

message SetSupervisionLimitsRequest {
    // The supervisor.
    string            account_id      = 1;
    string            teen_account_id = 2;
    SupervisionLimits limits          = 3;
}

message GetSupervisionLimitsRequest {
    string account_id      = 1;
    // Empty: the caller's own (a teen).
    string teen_account_id = 2;
}

message ReportScreenTimeRequest {
    string account_id = 1;
    // Minutes of use since the last report, 1–15.
    uint32 minutes    = 2;
    // The device's IANA zone (e.g. "Europe/Paris"): the day counted.
    string timezone   = 3;
}

message ScreenTimeView {
    // Today, all devices together.
    uint32 used_minutes  = 1;
    // 0: no daily limit.
    uint32 limit_minutes = 2;
    // Show the pause screen.
    bool   reached       = 3;
}

message GetSupervisionOverviewRequest {
    string account_id      = 1;
    // Empty: the caller's own (a teen).
    string teen_account_id = 2;
}

// One day of time on the app.
message ScreenTimeDay {
    // The teen's local day, "YYYY-MM-DD".
    string day     = 1;
    uint32 minutes = 2;
}

message SupervisionOverview {
    SupervisionLimitsView       limits      = 1;
    // The last 7 days with time counted, most recent first (time is counted
    // only under a daily limit; a day without use is absent).
    repeated ScreenTimeDay      screen_time = 2;
    // The teen's active profiles, whose connections can be listed.
    repeated SupervisionProfile profiles    = 3;
}

message ListSupervisedConnectionsRequest {
    string                   account_id      = 1;
    // Empty: the caller's own (a teen).
    string                   teen_account_id = 2;
    // One of the teen's profiles.
    string                   profile_id      = 3;
    SupervisedConnectionKind kind            = 4;
    // Default 50, capped at 100.
    int32                    limit           = 5;
    // Opaque cursor from a previous response; empty for the first page.
    string                   page_token      = 6;
}

// A profile on the other end of a connection (the app shows it from its id).
message SupervisedConnection {
    string                    profile_id = 1;
    // Followed or blocked at.
    google.protobuf.Timestamp since      = 2;
}

message ListSupervisedConnectionsResponse {
    repeated SupervisedConnection connections     = 1;
    // Empty on the last page.
    string                        next_page_token = 2;
}

message ListSupervisedReportsRequest {
    string account_id      = 1;
    // Empty: the caller's own (a teen).
    string teen_account_id = 2;
    // Default 50, capped at 100.
    int32  limit           = 3;
    // Opaque cursor from a previous response; empty for the first page.
    string page_token      = 4;
}

// A report the teen made: who or what, when and the decision.
message SupervisedReport {
    // post, comment, chat_message, media, account or profile.
    string                    entity_type = 1;
    string                    entity_id   = 2;
    // The policy category chosen: spam, harassment, hate, violent_extremism,
    // csam, ncii, self_harm, misinformation or other.
    string                    category    = 3;
    SupervisedReportOutcome   outcome     = 4;
    google.protobuf.Timestamp reported_at = 5;
}

message ListSupervisedReportsResponse {
    // Newest first.
    repeated SupervisedReport reports         = 1;
    // Empty on the last page.
    string                    next_page_token = 2;
}
