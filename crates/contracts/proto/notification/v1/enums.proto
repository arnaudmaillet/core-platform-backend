syntax = "proto3";

package notification.v1;

// Semantic type of the action that generated the notification.
// Drives the icon, copy template selection, and deep-link routing on the client.
enum NotificationKind {
    NOTIFICATION_KIND_UNSPECIFIED = 0;
    // A profile reacted to a post authored by the recipient.
    NOTIFICATION_KIND_REACTION    = 1;
    // A profile commented on a post authored by the recipient.
    NOTIFICATION_KIND_COMMENT     = 2;
    // A profile replied to a comment authored by the recipient.
    NOTIFICATION_KIND_REPLY       = 3;
    // A profile mentioned the recipient in a post or comment caption.
    NOTIFICATION_KIND_MENTION     = 4;
    // A profile started following the recipient (subject: that profile).
    NOTIFICATION_KIND_FOLLOW          = 5;
    // A profile asked to follow the recipient's private profile (subject: the
    // requester; the app opens the follow-requests inbox).
    NOTIFICATION_KIND_FOLLOW_REQUEST  = 6;
    // The private profile the recipient asked to follow accepted (subject:
    // that profile).
    NOTIFICATION_KIND_FOLLOW_ACCEPTED = 7;
    // The recipient's appeal was decided and the decision stands (subject: the
    // appeal; sent by the platform, so no sender — see NotificationView).
    // Every profile of the appellant account is told (#744).
    NOTIFICATION_KIND_APPEAL_UPHELD    = 8;
    // The recipient's appeal was decided in their favour: a sanction is lifted,
    // or a reporter's case goes back to review (the appeal says which).
    NOTIFICATION_KIND_APPEAL_OVERTURNED = 9;
    // Family supervision (#670): a parent and a teen paired (sender: the
    // other side's profile; subject: the other side's account — the app
    // opens Settings → Supervision).
    NOTIFICATION_KIND_SUPERVISION_STARTED     = 10;
    // The other side ended the supervision, or their account was erased.
    NOTIFICATION_KIND_SUPERVISION_ENDED       = 11;
    // The supervision ended because the teen turned 18.
    NOTIFICATION_KIND_SUPERVISION_CAME_OF_AGE = 12;
}

// Discriminates the entity that was interacted with.
// Used by the client to resolve the correct deep-link URL.
enum SubjectKind {
    SUBJECT_KIND_UNSPECIFIED = 0;
    // The subject is a post (post_id stored in subject_id).
    SUBJECT_KIND_POST        = 1;
    // The subject is a comment (comment_id stored in subject_id).
    SUBJECT_KIND_COMMENT     = 2;
    // The subject is a profile (profile_id stored in subject_id).
    SUBJECT_KIND_PROFILE     = 3;
    // The subject is a moderation appeal (appeal_id stored in subject_id; the
    // app finds it with moderation's ListMyAppeals).
    SUBJECT_KIND_APPEAL      = 4;
    // The subject is an account (account_id in subject_id): the other side
    // of a family supervision (#670).
    SUBJECT_KIND_ACCOUNT     = 5;
}

// What a push or an email is about (notification preferences, #654).
enum PushCategory {
    PUSH_CATEGORY_UNSPECIFIED     = 0;
    PUSH_CATEGORY_LIKES           = 1;
    PUSH_CATEGORY_COMMENTS        = 2;
    PUSH_CATEGORY_MENTIONS        = 3;
    PUSH_CATEGORY_NEW_FOLLOWERS   = 4;
    PUSH_CATEGORY_FOLLOW_REQUESTS = 5;
    PUSH_CATEGORY_MESSAGES        = 6;
    // New posts from accounts the holder follows.
    PUSH_CATEGORY_FOLLOWED_POSTS  = 7;
    PUSH_CATEGORY_PLACES_NEARBY   = 8;
    PUSH_CATEGORY_WALLET          = 9;
}

enum DevicePlatform {
    DEVICE_PLATFORM_UNSPECIFIED = 0;
    DEVICE_PLATFORM_IOS         = 1;
    DEVICE_PLATFORM_ANDROID     = 2;
}

// APNs environment of a token (development builds use the sandbox).
enum PushEnvironment {
    PUSH_ENVIRONMENT_UNSPECIFIED = 0;
    PUSH_ENVIRONMENT_SANDBOX     = 1;
    PUSH_ENVIRONMENT_PRODUCTION  = 2;
}
