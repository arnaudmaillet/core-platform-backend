syntax = "proto3";

package comment.v1;

// Lifecycle states for a comment.
// DELETED is a terminal state — once set it cannot be reversed.
enum CommentStatus {
    COMMENT_STATUS_UNSPECIFIED = 0;
    COMMENT_STATUS_PUBLISHED   = 1;
    COMMENT_STATUS_DELETED     = 2;
}

// The order of a thread's replies (#832).
enum ReplySort {
    // NEWEST.
    REPLY_SORT_UNSPECIFIED = 0;
    // Newest first.
    REPLY_SORT_NEWEST      = 1;
    // Most liked first (likes are wallet stakes, counted by engagement);
    // ties go to the newest.
    REPLY_SORT_POPULARITY  = 2;
}
