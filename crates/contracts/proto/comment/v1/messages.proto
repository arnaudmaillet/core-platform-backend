syntax = "proto3";

package comment.v1;

import "comment/v1/enums.proto";

// ── Commands ──────────────────────────────────────────────────────────────────

// At least one of body or (gif_id + gif_url) must be non-empty.
// parent_id is empty for top-level comments; non-empty for replies.
// Depth is limited to 1 — replying to a reply is rejected at the domain layer.
message CreateCommentRequest {
    string comment_id = 1;
    string post_id    = 2;
    string author_id  = 3;
    string parent_id  = 4;
    string body       = 5;
    string gif_id     = 6;
    string gif_url    = 7;
    uint32 gif_width  = 8;
    uint32 gif_height = 9;
}

// The post's owner approves (shows and announces) or declines (removes) a
// held comment.
message ReviewHeldCommentRequest {
    string comment_id = 1;
    string owner_id   = 2;
    bool   approve    = 3;
}

message DeleteCommentRequest {
    string comment_id = 1;
    string author_id  = 2;
}

// ── Queries ───────────────────────────────────────────────────────────────────

message GetCommentRequest {
    string comment_id = 1;
}

// Lists top-level (non-reply) comments for a post, newest-first.
message ListTopLevelRequest {
    string post_id    = 1;
    int32  limit      = 2;
    string page_token = 3;
}

// Lists direct replies to a single top-level comment, newest-first.
message ListRepliesRequest {
    string    post_id    = 1;
    string    comment_id = 2;
    int32     limit      = 3;
    // The previous page's `next_token`, from a request with the same `sort`.
    string    page_token = 4;
    // NEWEST by default (#832). POPULARITY ranks the thread's 500 newest
    // replies by their likes (ties to the newest), then the older ones newest
    // first. Pages resume after the last reply of the previous one, by (likes,
    // created_at, comment_id); the ranking is read again per page, so a reply
    // whose likes change between pages can show twice or be passed over:
    // de-duplicate by comment_id. Engagement unavailable: NEWEST order.
    ReplySort sort       = 5;
}

message ListCommentsByAuthorRequest {
    string author_id  = 1;
    int32  limit      = 2;
    string page_token = 3;
}

// ── Responses ─────────────────────────────────────────────────────────────────

message CommandResponse {
    bool   success = 1;
    string message = 2;
}

message CreateCommentResponse {
    string comment_id = 1;
    string post_id    = 2;
}

message GifMetadata {
    string gif_id     = 1;
    string gif_url    = 2;
    uint32 gif_width  = 3;
    uint32 gif_height = 4;
}

// Full comment projection returned by GetComment.
// body and gif are absent on tombstoned (deleted-with-replies) comments.
message CommentView {
    string        comment_id    = 1;
    string        post_id       = 2;
    string        author_id     = 3;
    string        parent_id     = 4;
    CommentStatus status        = 5;
    string        body          = 6;
    GifMetadata   gif           = 7;
    int64         created_at_ms = 8;
    int64         updated_at_ms = 9;
    // Held for the post owner's review (their temporary interaction limit,
    // #669): only its author and the post's owner see it.
    bool          held          = 10;
    // A top-level comment's replies, held ones included (#832). Filled by
    // ListTopLevel; 0 elsewhere. A comment's likes: engagement BatchGetLikes.
    uint64        reply_count   = 11;
}

message ListCommentsResponse {
    repeated CommentView comments   = 1;
    string               next_token = 2;
}
