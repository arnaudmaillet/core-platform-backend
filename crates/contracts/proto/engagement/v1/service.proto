syntax = "proto3";

package engagement.v1;

import "engagement/v1/messages.proto";

service EngagementService {
    // Increments the view counter for a post. Fire-and-forget on the hot path.
    rpc RecordView        (RecordViewRequest)        returns (CommandResponse);

    // Increments the share counter for a post. Fire-and-forget on the hot path.
    rpc RecordShare       (RecordShareRequest)       returns (CommandResponse);

    // A post's likes (#665: a like is a point, staked in the wallet:
    // wallet.Stake) and its view, share and comment counters.
    rpc GetPostEngagement (GetPostEngagementRequest) returns (PostEngagementView);

    // The likes of up to 100 posts and comments (#665: a like is a point
    // staked in the wallet): each one's count — 0 and `hidden` on a post whose
    // author hides like counts (#809), unless the reader is the author — and
    // the reader's own likes (a member: its account's; 0 otherwise).
    rpc BatchGetLikes (BatchGetLikesRequest) returns (BatchGetLikesResponse);

    // What an account liked (each post or comment, its points, when), paged
    // by target. Mesh only (never on the edge): the GDPR data export (#653).
    rpc ListLikesByAccount (ListLikesByAccountRequest) returns (ListLikesByAccountResponse);

    // An account's position on posts and comments: its points, the target's
    // like count just before its first like, and the count now. Mesh only:
    // the wallet's stake settlement (#665).
    rpc GetLikePositions (GetLikePositionsRequest) returns (GetLikePositionsResponse);

    // A profile's Likes tab (#829): the posts it liked, newest posts first.
    // The owner always sees it; anyone else only when the owner shows the tab
    // and may see the profile (a private profile they don't follow, a block):
    // otherwise empty. Hydrate the posts through post, which withholds what
    // the reader can't see.
    rpc ListLikesByProfile (ListLikesByProfileRequest) returns (ListLikesByProfileResponse);
    // Saves a post for one of the caller's profiles (#872), private by
    // default. Idempotent: saving a saved post keeps its first save time.
    rpc SavePost (SavePostRequest) returns (SavePostResponse);
    // Unsaves it. Idempotent: unsaving what isn't saved is a no-op.
    rpc UnsavePost (UnsavePostRequest) returns (UnsavePostResponse);
    // A profile's Saved tab (#872): the posts it saved, most recently saved
    // first. The owner always sees it; anyone else only when the owner shows
    // the tab (hidden by default) and may see the profile, and then only the
    // posts whose authors they may see: otherwise empty.
    rpc ListSavedPosts (ListSavedPostsRequest) returns (ListSavedPostsResponse);
    // What an account saved, with each post's profile, paged. Mesh only
    // (never on the edge): the GDPR data export (#872).
    rpc ListSavedPostsByAccount (ListSavedPostsByAccountRequest) returns (ListSavedPostsByAccountResponse);
}
