syntax = "proto3";

package engagement.v1;

import "google/protobuf/timestamp.proto";

// ── Commands ──────────────────────────────────────────────────────────────────

message RecordViewRequest {
    string post_id = 1;
}

message RecordShareRequest {
    string post_id = 1;
}

// ── Queries ───────────────────────────────────────────────────────────────────

message GetPostEngagementRequest {
    string post_id = 1;
}


// ── Responses ─────────────────────────────────────────────────────────────────

message CommandResponse {
    bool   success = 1;
    string message = 2;
}

// A post's engagement: its likes and its counters, from Redis.
message PostEngagementView {
    // The weighted reactions, before likes became points (#665).
    reserved 2, 3;
    reserved "reaction_scores", "total_weighted_score";
    string                    post_id              = 1;
    int64                     view_count           = 4;
    int64                     share_count          = 5;
    int64                     comment_count        = 6;
    // Likes (#665: a like is a point): the points staked on the post (0 when
    // `likes_hidden`), and the reader's own.
    int64                     like_count           = 7;
    int64                     my_likes             = 8;
    // The author hides like counts (#809) and the reader is not the author.
    bool                      likes_hidden         = 9;
}

// What a like lands on.
message LikeTarget {
    oneof target {
        string post_id    = 1;
        string comment_id = 2;
    }
}

message BatchGetLikesRequest {
    // At most 100.
    repeated LikeTarget targets = 1;
}

// One target's likes, as the reader sees them.
message LikeView {
    LikeTarget target   = 1;
    // Points staked on it (0 when `hidden`).
    int64      count    = 2;
    // The reader's own.
    int64      mine     = 3;
    bool       hidden   = 4;
}

message BatchGetLikesResponse {
    // In the request's order.
    repeated LikeView likes = 1;
}

// One post or comment an account liked (#653, #665).
message AccountLikeView {
    LikeTarget                target     = 1;
    // The account's points on it.
    int64                     total      = 2;
    // The profile that liked last.
    string                    profile_id = 3;
    google.protobuf.Timestamp liked_at   = 4;
}

message ListLikesByAccountRequest {
    string account_id = 1;
    // Default 100, capped at 500.
    int32  limit      = 2;
    // The `next_page_token` of the previous page (empty: the first).
    string page_token = 3;
}

message ListLikesByAccountResponse {
    repeated AccountLikeView likes           = 1;
    // Empty on the last page.
    string                   next_page_token = 2;
}

message GetLikePositionsRequest {
    string              account_id = 1;
    // At most 100.
    repeated LikeTarget targets    = 2;
}

// One account's position on a post or comment (#665).
message LikePosition {
    LikeTarget     target           = 1;
    // The account's points on it (0: none).
    int64          total            = 2;
    // The target's like count just before the account's first like. Absent
    // when it has none, or for a like recorded before arrivals were kept.
    optional int64 count_on_arrival = 3;
    // The target's like count now.
    int64          count_now        = 4;
}

message GetLikePositionsResponse {
    // In the request's order.
    repeated LikePosition positions = 1;
}
