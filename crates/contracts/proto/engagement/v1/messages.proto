syntax = "proto3";

package engagement.v1;

import "engagement/v1/enums.proto";

// ── Commands ──────────────────────────────────────────────────────────────────

message UpsertReactionRequest {
    string       post_id    = 1;
    string       profile_id = 2;
    ReactionKind kind       = 3;
}

message RemoveReactionRequest {
    string post_id    = 1;
    string profile_id = 2;
}

message RecordViewRequest {
    string post_id = 1;
}

message RecordShareRequest {
    string post_id = 1;
}

// ── Queries ───────────────────────────────────────────────────────────────────

message GetPostEngagementRequest {
    string post_id = 1;
}

message ListReactionsByProfileRequest {
    string profile_id = 1;
    int32  limit      = 2;
    // The `next_page_token` of the previous page (empty: the first).
    string page_token = 3;
}

// ── Responses ─────────────────────────────────────────────────────────────────

message CommandResponse {
    bool   success = 1;
    string message = 2;
}

// Per-reaction-kind score entry.
message ReactionScoreEntry {
    ReactionKind kind  = 1;
    int64        score = 2;
}

// Full engagement snapshot for a post. All counts are sourced from Redis.
message PostEngagementView {
    string                    post_id              = 1;
    repeated ReactionScoreEntry reaction_scores    = 2;
    int64                     total_weighted_score = 3;
    int64                     view_count           = 4;
    int64                     share_count          = 5;
    int64                     comment_count        = 6;
    // Likes (#665: a like is a point): the points staked on the post (0 when
    // `likes_hidden`), and the reader's own.
    int64                     like_count           = 7;
    int64                     my_likes             = 8;
    // The author hides like counts (#809) and the reader is not the author.
    bool                      likes_hidden         = 9;
}

// What a like lands on.
message LikeTarget {
    oneof target {
        string post_id    = 1;
        string comment_id = 2;
    }
}

message BatchGetLikesRequest {
    // At most 100.
    repeated LikeTarget targets = 1;
}

// One target's likes, as the reader sees them.
message LikeView {
    LikeTarget target   = 1;
    // Points staked on it (0 when `hidden`).
    int64      count    = 2;
    // The reader's own.
    int64      mine     = 3;
    bool       hidden   = 4;
}

message BatchGetLikesResponse {
    // In the request's order.
    repeated LikeView likes = 1;
}

// One reaction of a profile (#653).
message ProfileReactionView {
    string       post_id        = 1;
    ReactionKind kind           = 2;
    int64        reacted_at_ms  = 3;
}

message ListReactionsByProfileResponse {
    repeated ProfileReactionView reactions       = 1;
    // Empty on the last page.
    string                       next_page_token = 2;
}
