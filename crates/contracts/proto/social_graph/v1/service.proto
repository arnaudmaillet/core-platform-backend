syntax = "proto3";

package social_graph.v1;

import "social_graph/v1/messages.proto";

option java_package = "com.coreplatform.socialgraph.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/social-graph/v1;socialgraphv1";

// SocialGraphService owns all directional relationships between profiles.
//
// SRP guarantee: this service operates exclusively on opaque ProfileId (UUIDv7)
// primitives. It has no knowledge of profile metadata (handles, bios, avatars).
// Social graph concerns must never bleed into services/profile or services/account.
//
// Supported relation kinds: Follow, Unfollow, Block, Unblock.
//
// Graph invariants enforced by this service:
//   1. Self-interaction is rejected (a profile cannot follow or block itself).
//   2. A block bi-directionally severs any existing follow and prevents future follows.
//   3. Mutual follows (A→B and B→A) are implicitly "friends" — no dedicated table.
//   4. Following a PRIVATE profile creates a pending request (no access until approved).
//
// All mutating RPCs (commands) return CommandResponse.
// All read RPCs (queries) return typed view or paginated response messages.
service SocialGraphService {

    // ── Commands ──────────────────────────────────────────────────────────────

    // Record that actor follows target — or, when target is private, that actor
    // asks to (CommandResponse.requested; SGR-1005 if already pending).
    // Rejected if a block exists in either direction, or if actor == target.
    rpc Follow(FollowRequest) returns (CommandResponse);

    // The private profile's pending follow requests, newest first (its owner).
    rpc ListFollowRequests(ListFollowRequestsRequest) returns (ListFollowRequestsResponse);

    // The owner lets the requester follow (a real follow: counts, feeds).
    rpc ApproveFollowRequest(AnswerFollowRequestRequest) returns (CommandResponse);

    // The owner turns the request down (the requester is not notified).
    rpc DeclineFollowRequest(AnswerFollowRequestRequest) returns (CommandResponse);

    // The requester withdraws a pending request. SGR-1006 if none is pending.
    rpc CancelFollowRequest(CancelFollowRequestRequest) returns (CommandResponse);

    // Remove an existing follow from actor to target.
    // Rejected if no follow exists.
    rpc Unfollow(UnfollowRequest) returns (CommandResponse);

    // The owner (profile_id) removes follower_id from their followers.
    // CommandResponse: actor_id = the owner, target_id = the removed follower.
    rpc RemoveFollower(RemoveFollowerRequest) returns (CommandResponse);

    // Who may see the owner's follower / following lists (everyone, followers,
    // mutuals, only me), enforced by ListFollowers / ListFollowing.
    rpc SetListPrivacy(SetListPrivacyRequest) returns (ListPrivacy);

    // Record that actor blocks target.
    // Severs any existing follow between them (in both directions).
    // Rejected if actor == target or if actor already blocks target.
    rpc Block(BlockRequest) returns (CommandResponse);

    // Remove an existing block issued by actor against target.
    // Does not restore severed follows.
    rpc Unblock(UnblockRequest) returns (CommandResponse);

    // ── Queries ───────────────────────────────────────────────────────────────

    // Returns the full bidirectional relationship context between actor and target,
    // plus the target's follower/following counts.
    rpc GetRelationStatus(GetRelationStatusRequest) returns (RelationStatusView);

    // Paginated list of profiles that follow the given profile (fan-in).
    rpc ListFollowers(ListFollowersRequest) returns (ListFollowersResponse);

    // Paginated list of profiles that the given profile follows (fan-out).
    rpc ListFollowing(ListFollowingRequest) returns (ListFollowingResponse);

    // The owner's list privacy (defaults: everyone).
    rpc GetListPrivacy(GetListPrivacyRequest) returns (ListPrivacy);

    // Paginated list of profiles blocked by the given profile.
    rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);

    // What a reader may see of each target profile's content: visible, header
    // only (a private profile the reader does not follow) or hidden (a block
    // either way, or a hidden profile). MESH-ONLY: services answering a client
    // read call it with the reader they took from the edge token.
    rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);

    // May the actor comment on / mention / message the target, per the
    // target's interaction settings (profile.v1) and blocks either way? A
    // profile may always interact with itself. MESH-ONLY: the service that
    // owns the interaction asks before writing it, with the actor taken from
    // the edge token.
    rpc CheckInteraction(CheckInteractionRequest) returns (CheckInteractionResponse);
}
