syntax = "proto3";

package social_graph.v1;

import "social_graph/v1/enums.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.coreplatform.socialgraph.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/social-graph/v1;socialgraphv1";

// ── Read models ───────────────────────────────────────────────────────────────

// The full relationship context between actor and target.
// Returned by GetRelationStatus.
message RelationStatusView {
    string         actor_id               = 1;
    string         target_id              = 2;
    RelationStatus status                 = 3;
    // Follower and following counts are for the target profile.
    int64          target_followers_count = 4;
    int64          target_following_count = 5;
    // How the actor mutes the target (all false when it does not).
    MuteScopes     muted                  = 6;
}

// A lightweight summary of one edge in an adjacency list.
// Used in paginated follower/following list responses.
message EdgeSummary {
    // The profile on the other end of the edge.
    // In ListFollowers responses: the follower_id.
    // In ListFollowing responses: the followee_id.
    string                    profile_id  = 1;
    google.protobuf.Timestamp followed_at = 2;
}

// A lightweight summary of one block edge.
message BlockSummary {
    string                    blockee_id  = 1;
    google.protobuf.Timestamp blocked_at  = 2;
}

// Generic acknowledge response for all mutating RPCs.
message CommandResponse {
    bool   success   = 1;
    string actor_id  = 2;
    string target_id = 3;
    // Follow only: the target is private, so a request is pending instead of
    // a follow (RELATION_STATUS_REQUESTED).
    bool   requested = 4;
}

// ── Command request messages ──────────────────────────────────────────────────

message FollowRequest {
    string actor_id  = 1;
    string target_id = 2;
}

message UnfollowRequest {
    string actor_id  = 1;
    string target_id = 2;
}

// The owner removes a profile from their followers (an unfollow on the
// follower's behalf; it is not notified). SGR-1002 if it does not follow.
message RemoveFollowerRequest {
    string profile_id  = 1;
    string follower_id = 2;
}

message BlockRequest {
    string actor_id  = 1;
    string target_id = 2;
}

message UnblockRequest {
    string actor_id  = 1;
    string target_id = 2;
}

// ── Query request / response messages ────────────────────────────────────────

message GetRelationStatusRequest {
    string actor_id  = 1;
    string target_id = 2;
}

message ListFollowersRequest {
    string followee_id = 1;
    int32  limit       = 2;
    string page_token  = 3;
}

message ListFollowersResponse {
    repeated EdgeSummary followers        = 1;
    string               next_page_token  = 2;
    // The reader may not see this list (a private profile they do not follow,
    // a block, a hidden profile, or the owner's list privacy); it is empty.
    bool                 hidden           = 3;
}

message ListFollowingRequest {
    string follower_id = 1;
    int32  limit       = 2;
    string page_token  = 3;
}

message ListFollowingResponse {
    repeated EdgeSummary following        = 1;
    string               next_page_token  = 2;
    // The reader may not see this list (a private profile they do not follow,
    // a block, a hidden profile, or the owner's list privacy); it is empty.
    bool                 hidden           = 3;
}

message ListBlocksRequest {
    string blocker_id  = 1;
    int32  limit       = 2;
    string page_token  = 3;
}

message ListBlocksResponse {
    repeated BlockSummary blocks          = 1;
    string                next_page_token = 2;
}

message CheckAccessRequest {
    // The profiles the reader's account owns (the token's `pids`); empty for
    // an anonymous reader. At most 20.
    repeated string viewer_profile_ids = 1;
    // The profiles whose content is being read (authors). At most 100.
    repeated string target_profile_ids = 2;
}

message TargetAccess {
    string        target_profile_id = 1;
    ContentAccess access            = 2;
}

message CheckAccessResponse {
    // One entry per distinct target.
    repeated TargetAccess targets = 1;
}

// ── Follow requests (private profiles) ────────────────────────────────────────

message ListFollowRequestsRequest {
    // The private profile whose pending requests to list (the caller's own).
    string owner_id   = 1;
    int32  limit      = 2;
    string page_token = 3;
}

message ListFollowRequestsResponse {
    // Requesters, newest first; `followed_at` is when they asked.
    repeated EdgeSummary requests        = 1;
    string               next_page_token = 2;
}

// The owner of `owner_id` answers `requester_id`'s request.
message AnswerFollowRequestRequest {
    string owner_id     = 1;
    string requester_id = 2;
}

// The requester withdraws their own pending request.
message CancelFollowRequestRequest {
    string actor_id  = 1;
    string target_id = 2;
}

// ── Interaction check (mesh-only) ─────────────────────────────────────────────

message CheckInteractionRequest {
    string          actor_profile_id  = 1;
    string          target_profile_id = 2;
    InteractionKind kind              = 3;
}

message CheckInteractionResponse {
    // false: a block either way, or the target's audience for `kind` excludes
    // the actor (followers / mutuals / no one).
    bool allowed = 1;
}

// ── List privacy (#659) ───────────────────────────────────────────────────────

// Who may see the profile's lists. The owner and mesh callers always may.
message ListPrivacy {
    ListAudience followers = 1;
    ListAudience following = 2;
}

message GetListPrivacyRequest {
    string profile_id = 1;
}

// An UNSPECIFIED list keeps its audience. Returns the resulting privacy.
message SetListPrivacyRequest {
    string       profile_id = 1;
    ListAudience followers  = 2;
    ListAudience following  = 3;
}

// ── Mutes (#659) ──────────────────────────────────────────────────────────────

// What a mute covers. Stories and messages are stored for the client; posts
// leave the muter's feeds.
message MuteScopes {
    bool posts    = 1;
    bool stories  = 2;
    bool messages = 3;
}

// Mute (or re-scope a mute of) target. At least one scope; the target is not
// told and follows are untouched.
message MuteRequest {
    string     actor_id  = 1;
    string     target_id = 2;
    MuteScopes scopes    = 3;
}

message UnmuteRequest {
    string actor_id  = 1;
    string target_id = 2;
}

message ListMutesRequest {
    string profile_id = 1;
    int32  limit      = 2;
    string page_token = 3;
}

message MuteSummary {
    string                    profile_id = 1;
    MuteScopes                scopes     = 2;
    google.protobuf.Timestamp muted_at   = 3;
}

message ListMutesResponse {
    repeated MuteSummary mutes           = 1;
    string               next_page_token = 2;
}

// MESH-ONLY: the profiles any of a reader's profiles (≤ 10) mutes for scope.
message ListMutedProfilesRequest {
    repeated string profile_ids = 1;
    MuteScope       scope       = 2;
}

message ListMutedProfilesResponse {
    repeated string profile_ids = 1;
}
