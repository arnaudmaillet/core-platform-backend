syntax = "proto3";

package social_graph.v1;

option java_package = "com.coreplatform.socialgraph.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/social-graph/v1;socialgraphv1";

// The combined relationship status between an actor and a target profile,
// as observed from the actor's point of view.
//
// Invariants enforced by the domain layer:
//   - Block states and follow states are mutually exclusive: a block severs
//     any existing follow in both directions and prevents future follows.
//   - MUTUAL_FOLLOW is the implicit "friendship" state; no dedicated table exists.
enum RelationStatus {
    RELATION_STATUS_UNSPECIFIED = 0;
    // No relationship exists between actor and target.
    RELATION_STATUS_NONE        = 1;
    // Actor follows target; target does not follow actor back.
    RELATION_STATUS_FOLLOWING   = 2;
    // Target follows actor; actor does not follow target back.
    RELATION_STATUS_FOLLOWED_BY = 3;
    // Both profiles follow each other (implicit friendship).
    RELATION_STATUS_MUTUAL      = 4;
    // Actor has blocked target. No follow is possible in either direction.
    RELATION_STATUS_BLOCKING    = 5;
    // Target has blocked actor. No follow is possible in either direction.
    RELATION_STATUS_BLOCKED_BY  = 6;
    // Actor asked to follow target (a private profile); awaiting the owner.
    RELATION_STATUS_REQUESTED   = 7;
}

// What a reader may see of a profile's content (CheckAccess).
enum ContentAccess {
    CONTENT_ACCESS_UNSPECIFIED = 0;
    // Posts, comments and lists are visible.
    CONTENT_ACCESS_VISIBLE     = 1;
    // A private profile the reader does not follow: its header only.
    CONTENT_ACCESS_HEADER_ONLY = 2;
    // Nothing: a block either way, or a hidden profile.
    CONTENT_ACCESS_HIDDEN      = 3;
}

// An interaction a profile's owner controls (profile.v1 InteractionSettings).
enum InteractionKind {
    INTERACTION_KIND_UNSPECIFIED = 0;
    // Commenting on the target's posts.
    INTERACTION_KIND_COMMENT     = 1;
    // Mentioning or tagging the target.
    INTERACTION_KIND_MENTION     = 2;
    // Messaging the target directly.
    INTERACTION_KIND_MESSAGE     = 3;
}

// Who may see one of a profile's relationship lists (followers, following).
enum ListAudience {
    // On a SetListPrivacy request: leave this list unchanged.
    LIST_AUDIENCE_UNSPECIFIED = 0;
    LIST_AUDIENCE_EVERYONE    = 1;
    // Profiles that follow the owner.
    LIST_AUDIENCE_FOLLOWERS   = 2;
    // Followers the owner follows back.
    LIST_AUDIENCE_MUTUALS     = 3;
    // The owner alone.
    LIST_AUDIENCE_ONLY_ME     = 4;
}
