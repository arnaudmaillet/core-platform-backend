syntax = "proto3";

package chat.v1;

import "chat/v1/messages.proto";

service ChatService {
    // ── Lifecycle / membership ──────────────────────────────────────────────
    rpc CreateConversation (CreateConversationRequest) returns (CreateConversationResponse);
    // Direct messages (#656): the conversation with one other profile, and
    // the recipient's answer to a message request.
    rpc OpenDirectConversation  (OpenDirectConversationRequest)  returns (OpenDirectConversationResponse);
    rpc RespondToMessageRequest (RespondToMessageRequestRequest) returns (CommandResponse);
    rpc ToggleVisibility   (ToggleVisibilityRequest)   returns (CommandResponse);
    // Joining a PRIVATE conversation requires a pending invitation (issued by
    // an owner/admin via InviteMember); without one the call fails NOT_FOUND,
    // exactly as for a conversation that does not exist. Public: open join.
    rpc JoinAsMember       (JoinAsMemberRequest)       returns (CommandResponse);
    // A member leaves (#656): off the roster and out of its inbox; its
    // membership is kept with left_at for the GDPR export.
    rpc LeaveConversation  (LeaveConversationRequest)  returns (CommandResponse);
    // Owner/admin invites a profile to join (expires after 7 days; consumed on join).
    rpc InviteMember       (InviteMemberRequest)       returns (CommandResponse);
    rpc Subscribe          (SubscribeRequest)          returns (CommandResponse);
    rpc Unsubscribe        (UnsubscribeRequest)        returns (CommandResponse);

    // ── Messaging ───────────────────────────────────────────────────────────
    rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
    rpc MarkRead    (MarkReadRequest)    returns (CommandResponse);
    // The member's pushes from the conversation, off for a while or until
    // they unmute (#654). The member's own setting; NOT_FOUND to a non-member.
    rpc MuteConversation (MuteConversationRequest) returns (CommandResponse);

    // ── Member-Plane signals (presence/typing) ──────────────────────────────
    rpc SendTyping (SendTypingRequest) returns (CommandResponse);
    rpc Heartbeat  (HeartbeatRequest)  returns (CommandResponse);

    // ── Queries ─────────────────────────────────────────────────────────────
    rpc GetHistory        (GetHistoryRequest)        returns (GetHistoryResponse);
    rpc ListMembers       (ListMembersRequest)       returns (ListMembersResponse);
    rpc ListSubscriptions (ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
    // The caller's inbox (#656): INBOX or REQUESTS, newest activity first.
    rpc ListInbox         (ListInboxRequest)         returns (ListInboxResponse);
    // What changed in the caller's inbox since a watermark (#930): the
    // entries now (unread, muted, moved between folders, a new last message),
    // the conversations to drop, and the next watermark. A watermark lives 35
    // days (past the app's 30-day retention); an older one answers
    // OUT_OF_RANGE (CHT-2013): resync in full with ListInbox. Edge: the
    // caller's profile.
    rpc SyncInbox         (SyncInboxRequest)         returns (SyncInboxResponse);
    // What is new in a conversation since a watermark (#930): its messages
    // after it, oldest first, and the members' read positions. Same audience
    // rules and watermark lifetime as SyncInbox. Edge: the caller's profile.
    rpc SyncConversation  (SyncConversationRequest)  returns (SyncConversationResponse);
    // The conversations a profile is a member of (member plane), paged by
    // conversation id. Mesh only (never on the edge): the GDPR data export
    // (#653) then reads each one's history as that member (GetHistory).
    rpc ListConversationsByMember (ListConversationsByMemberRequest) returns (ListConversationsByMemberResponse);
    // Mesh only (#653 / #656): a member's own messages, others' reduced to
    // their time, up to its departure if it left — the export's read.
    rpc GetFormerMemberHistory (GetFormerMemberHistoryRequest) returns (GetHistoryResponse);

    // ── Real-time streams ───────────────────────────────────────────────────
    // Member Plane: full duplex context — messages + presence + typing + receipts.
    // Authorization: caller must be a roster member.
    rpc StreamConversation (StreamConversationRequest) returns (stream StreamConversationResponse);

    // Audience Plane: read-only shadow — messages only, no presence overhead.
    // Authorization: conversation must be public.
    rpc StreamPublic (StreamPublicRequest) returns (stream StreamPublicResponse);
}
