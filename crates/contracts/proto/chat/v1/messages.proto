syntax = "proto3";

package chat.v1;

import "chat/v1/enums.proto";
import "media/v1/messages.proto";

// ── Shared view types ───────────────────────────────────────────────────────

// Projection of a single message. IDs only for actors; the client hydrates
// display data from the profile service.
message MessageView {
    string      message_id    = 1;
    string      sender_id     = 2;
    ContentType content_type  = 3;
    string      body          = 4;
    string      media_ref     = 5; // empty unless content_type == MEDIA
    string      reply_to      = 6; // empty unless this is a threaded reply
    int64       created_at_ms = 7;
    // #919: the media asset a MEDIA message shows, when sent with one — a
    // stable cache key. Its delivery is SIGNED: GetHistory carries it in
    // `media`; on the live streams resolve it (GetHistory, or media's
    // ResolveDelivery) as the signed URLs expire.
    string      media_asset_id = 8;
    // #919: GetHistory only — the blurhash and, once READY, every rendition
    // (signed URL, size, expiry). Absent when media could not answer in time
    // (fail-open).
    media.v1.DeliveredMedia media = 9;
}

// Projection of a member-roster entry.
message MemberView {
    string profile_id   = 1;
    Role   role         = 2;
    int64  joined_at_ms = 3;
    string last_read    = 4; // empty until the member has read anything
}

// ── Real-time stream payloads ───────────────────────────────────────────────

message PresenceEvent {
    string member_id = 1;
    bool   online    = 2;
}

message TypingEvent {
    string member_id = 1;
}

message ReceiptEvent {
    string member_id = 1;
    string last_read = 2;
}

// A Member-Plane event: a message OR a presence/typing/receipt signal.
message ChatEvent {
    oneof event {
        MessageView   message  = 1;
        PresenceEvent presence = 2;
        TypingEvent   typing   = 3;
        ReceiptEvent  receipt  = 4;
    }
}

// ── Commands ────────────────────────────────────────────────────────────────

message CreateConversationRequest {
    ConversationKind kind     = 1;
    string           owner_id = 2;
}
message CreateConversationResponse {
    string conversation_id = 1;
}

// A member leaves a group or channel (#656). The owner may not (CHT-9004);
// nobody leaves a direct conversation.
message LeaveConversationRequest {
    string conversation_id = 1;
    string profile_id      = 2;
}

// The direct conversation between the caller's profile and `peer_id`
// (#656), opened if need be — one per pair, whoever opens it.
message OpenDirectConversationRequest {
    string profile_id = 1;
    string peer_id    = 2;
}
message OpenDirectConversationResponse {
    string conversation_id = 1;
    // The peer's settings do not admit the caller: their messages are a
    // request, waiting for the peer's answer. One message until then; more
    // fail CHT-1010. A peer who takes messages from no one: CHT-1011.
    bool   request         = 2;
}

// The recipient of a message request accepts it (the conversation opens) or
// declines it (silently: the requester keeps seeing it pending, and may not
// ask again for 30 days). Replying, or opening the conversation, also accepts.
message RespondToMessageRequestRequest {
    string conversation_id = 1;
    string profile_id      = 2;
    bool   accept          = 3;
}

message SendMessageRequest {
    string      conversation_id = 1;
    string      sender_id       = 2;
    ContentType content_type    = 3;
    string      body            = 4;
    string      media_ref       = 5;
    string      reply_to        = 6;
    // Optional, client-generated, one per message and reused on every retry
    // (8–64 characters: letters, digits, `-`, `_`; CHT-2010 otherwise). A
    // repeated key from the same sender in the same conversation, within
    // 24 hours, stores nothing and answers the message the first send stored.
    // While that first send is still in flight a repeat fails ABORTED
    // (CHT-1013): retry it. Empty: no deduplication.
    string      idempotency_key = 7;
    // #919: the media asset a MEDIA message shows (media IssueUploadTicket's
    // asset_id). Optional; media_ref may then stay empty. It must be an image
    // or video of the sender's account, not failed, quarantined or deleted
    // (FAILED_PRECONDITION, CHT-2011). Chat media is SIGNED: a READY image is
    // made SIGNED, one still processing must have been uploaded SIGNED
    // (CHT-2012). Media unreachable ⇒ UNAVAILABLE (CHT-5002).
    string      media_asset_id  = 8;
}
message SendMessageResponse {
    // The stored message; on a repeated idempotency key, the first send's.
    string message_id = 1;
}

message ToggleVisibilityRequest {
    string conversation_id = 1;
    string actor_id        = 2;
    bool   make_public     = 3;
}

message JoinAsMemberRequest {
    string conversation_id = 1;
    string profile_id      = 2;
}

message InviteMemberRequest {
    string conversation_id = 1;
    string inviter_id      = 2; // must be an owner/admin of the conversation
    string invitee_id      = 3;
}

message SubscribeRequest {
    string conversation_id = 1;
    string subscriber_id   = 2;
}

message UnsubscribeRequest {
    string conversation_id = 1;
    string subscriber_id   = 2;
}

message MarkReadRequest {
    string conversation_id = 1;
    string member_id       = 2;
    string message_id      = 3;
}

message MuteConversationRequest {
    string conversation_id = 1;
    string member_id       = 2;
    // false: unmute (until_ms is ignored).
    bool   muted           = 3;
    // When the mute ends (within a year); 0: until unmuted.
    int64  until_ms        = 4;
}

message SendTypingRequest {
    string conversation_id = 1;
    string member_id       = 2;
}

message HeartbeatRequest {
    string conversation_id = 1;
    string member_id       = 2;
}

message CommandResponse {
    bool   success = 1;
    string message = 2;
}

// ── Queries ─────────────────────────────────────────────────────────────────

message GetHistoryRequest {
    string conversation_id = 1;
    string requester_id    = 2;
    int32  limit           = 3;
    string page_token      = 4;
}
message GetHistoryResponse {
    repeated MessageView messages        = 1;
    string               next_page_token = 2;
    // First page only (#930): the watermark SyncConversation takes once the
    // client holds the history it wants (taken before reading).
    string               sync_watermark  = 3;
}

message SyncConversationRequest {
    string conversation_id = 1;
    string requester_id    = 2;
    // GetHistory's first-page `sync_watermark`, or a previous sync's.
    string watermark       = 3;
    int32  limit           = 4;
}
message SyncConversationResponse {
    // The messages after the watermark, oldest first (messages are
    // append-only: nothing is edited or deleted).
    repeated MessageView messages      = 1;
    // Each member's read position now (a direct or group conversation, to a
    // member; a member shares it only if they share read receipts, #661).
    repeated MemberView  read_receipts = 2;
    // Where to sync from next.
    string               watermark     = 3;
    // More messages wait: sync again at once from `watermark`.
    bool                 has_more      = 4;
}

message ListMembersRequest {
    string conversation_id = 1;
    string requester_id    = 2;
}
message ListMembersResponse {
    repeated MemberView members = 1;
}

message ListSubscriptionsRequest {
    string subscriber_id = 1;
    int32  limit         = 2;
    string page_token    = 3;
}
message ListSubscriptionsResponse {
    repeated string conversation_ids = 1;
    string          next_page_token  = 2;
}

// The caller's inbox, one folder, newest activity first (#656).
message ListInboxRequest {
    string      profile_id = 1;
    InboxFolder folder     = 2;
    int32       limit      = 3;
    // The `next_page_token` of the previous page (empty: the first).
    string      page_token = 4;
}
// The last delivered message, previewed.
message MessagePreview {
    string      message_id    = 1;
    string      sender_id     = 2;
    ContentType content_type  = 3;
    // The body's first 100 characters.
    string      preview       = 4;
}
message InboxEntryView {
    string           conversation_id  = 1;
    ConversationKind kind             = 2;
    // The other member of a direct conversation.
    string           peer_id          = 3;
    // The last message's time, else when the caller joined.
    int64            last_activity_ms = 4;
    // Absent before any delivered message.
    MessagePreview   last_message     = 5;
    // The last message is someone else's and newer than the caller's read
    // position. A request stays unread until answered (no receipt is kept).
    bool             unread           = 6;
    // The caller's own request, awaiting the peer's answer.
    bool             request          = 7;
    // The caller muted the conversation's pushes (#654) …
    bool             muted            = 8;
    // … until then; 0 when until they unmute.
    int64            muted_until_ms   = 9;
}
message ListInboxResponse {
    repeated InboxEntryView entries         = 1;
    // Empty on the last page. A page may come back short, never skipping.
    string                  next_page_token = 2;
    // First page only (#930): the watermark SyncInbox takes once every page
    // of every folder is read (taken before reading).
    string                  sync_watermark  = 3;
}

message SyncInboxRequest {
    string profile_id = 1;
    // ListInbox's first-page `sync_watermark`, or a previous sync's.
    string watermark  = 2;
    int32  limit      = 3;
}
// A conversation whose entry changed (#930), as the caller sees it now, in its
// folder.
message InboxChange {
    InboxFolder    folder = 1;
    InboxEntryView entry  = 2;
}
message SyncInboxResponse {
    repeated InboxChange changed   = 1;
    // Conversations to drop from the inbox (left, declined, hidden by a
    // block or no longer shown).
    repeated string      removed   = 2;
    string               watermark = 3;
    // More changes wait: sync again at once from `watermark`.
    bool                 has_more  = 4;
}

message ListConversationsByMemberRequest {
    string member_id  = 1;
    int32  limit      = 2;
    // The `next_page_token` of the previous page (empty: the first).
    string page_token = 3;
}
message MembershipView {
    string                    conversation_id = 1;
    Role                      role            = 2;
    int64                     joined_at_ms    = 3;
    // The conversation's kind: the GDPR export shows a DIRECT one in full.
    ConversationKind          kind            = 4;
    // When the profile left (#656); 0 while a member. Read a left
    // conversation with GetFormerMemberHistory.
    int64                     left_at_ms      = 5;
}

// The member's view of a conversation it is or was a member of, for the GDPR
// data export (mesh only): its own messages in full; everyone else's reduced
// to created_at_ms (sender_id and content empty); a former member's up to
// its departure only.
message GetFormerMemberHistoryRequest {
    string conversation_id = 1;
    string member_id       = 2;
    int32  limit           = 3;
    string page_token      = 4;
}
message ListConversationsByMemberResponse {
    repeated MembershipView memberships     = 1;
    // Empty on the last page.
    string                  next_page_token = 2;
}

// ── Streaming ───────────────────────────────────────────────────────────────

message StreamConversationRequest {
    string conversation_id = 1;
    string member_id       = 2;
}
message StreamConversationResponse {
    ChatEvent event = 1;
}

message StreamPublicRequest {
    string conversation_id = 1;
    string subscriber_id   = 2; // the caller's own profile id (bound at the edge); keys the audience shard
}
message StreamPublicResponse {
    MessageView message = 1;
}
