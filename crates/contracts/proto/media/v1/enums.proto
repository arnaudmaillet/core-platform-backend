syntax = "proto3";

package media.v1;

option java_package = "com.coreplatform.media.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/media/v1;mediav1";

// The kind of media an asset holds. `kind` drives the validation policy (MIME
// allowlist, size ceiling), the rendition ladder generated for it, and the
// content-addressed storage path. Images (AVATAR, POST_IMAGE) are fully served.
// VIDEO is contract-first: the enum value is defined so clients can model it and
// generate types, but the ingest/transcode pipeline is a staged fast-follow — the
// service rejects video upload tickets as UNIMPLEMENTED until it lands. Grow this
// enum additively; never renumber.
enum MediaKind {
    MEDIA_KIND_UNSPECIFIED = 0;
    // A profile/account avatar — square-cropped rendition ladder.
    MEDIA_KIND_AVATAR      = 1;
    // An image attached to a post — feed-sized rendition ladder.
    MEDIA_KIND_POST_IMAGE  = 2;
    // A video attached to a post — adaptive-streaming ladder (manifest + poster).
    // Contract-first: not yet accepted for upload (see the enum note above).
    MEDIA_KIND_VIDEO       = 3;
    // Evidence for a profile verification request (#777): JPEG, PNG, HEIC or
    // PDF, ≤ 10 MiB. Private: no renditions, never returned by ResolveDelivery /
    // BatchResolveDelivery (NOT_FOUND / omitted), metadata to its owner only,
    // a short-lived signed link to staff over the mesh (GetPrivateDocumentUrl).
    // Purged 30 days after the request's decision, and with the account.
    MEDIA_KIND_PRIVATE_DOCUMENT = 4;
    // An animated avatar's clip (#945, #948): MP4 or QuickTime, ≤ 20 MiB, at
    // least 2 s (its first 3 s are used, muted). The worker bakes it into two
    // sprite sheets (SHEET_SMALL, SHEET_LARGE: 24 frames at 12 fps, square
    // 128 / 256 px cells, 4 columns, a 2 px transparent gutter inside each
    // cell, AVIF) that loop seamlessly (the last frame flows into the first),
    // and a POSTER: the sheet's last frame, for consumers that cannot play a
    // sheet (push images, link previews, web). Never served as a video.
    MEDIA_KIND_AVATAR_CLIP      = 5;
}

// The asset lifecycle state machine. An asset is created PENDING at ticket time,
// advances through UPLOADED → PROCESSING as the pipeline runs, and lands in one of
// the terminal-ish states READY / FAILED / QUARANTINED / DELETED. The publish path
// of `post`/`profile` never waits on this — a post may reference a PENDING/
// PROCESSING asset and render the blurhash placeholder until it reaches READY.
enum AssetState {
    MEDIA_ASSET_STATE_UNSPECIFIED = 0;
    // Ticket issued; awaiting the client's direct-to-object-store upload.
    MEDIA_ASSET_STATE_PENDING     = 1;
    // Bytes landed and finalize was accepted; pre-processing.
    MEDIA_ASSET_STATE_UPLOADED    = 2;
    // The async transformation pipeline is running (validate → screen → derive).
    MEDIA_ASSET_STATE_PROCESSING  = 3;
    // All renditions are available; the asset is deliverable.
    MEDIA_ASSET_STATE_READY       = 4;
    // Processing failed terminally (corrupt media, unsupported codec, etc.).
    MEDIA_ASSET_STATE_FAILED      = 5;
    // A moderation takedown / compliance hold revoked delivery. Bytes may be
    // preserved (legal hold) even though the asset is undeliverable.
    MEDIA_ASSET_STATE_QUARANTINED = 6;
    // Hard-deleted (bytes purged, honoring the dedup refcount). Absent a legal hold.
    MEDIA_ASSET_STATE_DELETED     = 7;
}

// A derivative of an asset. Each rendition is a separately-stored, content-
// addressed object; the caller receives a URL to it via the delivery plane, never
// the bytes. Image renditions are size buckets; video renditions are the playback
// manifest and a poster. In both cases the concrete format (image WebP/AVIF/JPEG,
// or streaming HLS/DASH) is carried per-rendition by its mime_type, not by this
// enum. Video renditions are contract-first — populated once the transcode
// pipeline lands.
enum RenditionKind {
    MEDIA_RENDITION_KIND_UNSPECIFIED = 0;
    // The validated master (post-probe, pre-derivation source of truth).
    MEDIA_RENDITION_KIND_ORIGINAL    = 1;
    MEDIA_RENDITION_KIND_THUMBNAIL   = 2;
    MEDIA_RENDITION_KIND_SMALL       = 3;
    MEDIA_RENDITION_KIND_MEDIUM      = 4;
    MEDIA_RENDITION_KIND_LARGE       = 5;
    // The adaptive-streaming playback manifest — a video's playback entry point.
    // Concrete packaging (HLS m3u8 / DASH mpd) rides in its mime_type.
    MEDIA_RENDITION_KIND_MANIFEST    = 6;
    // A still poster frame for feed first-paint before playback starts. For an
    // AVATAR_CLIP: its sheet's last frame (#948), the same picture the sheet
    // rests on.
    MEDIA_RENDITION_KIND_POSTER      = 7;
    // An animated avatar's sprite sheet (#945), 128 px cells; its layout rides
    // in DeliveredRendition.sheet.
    MEDIA_RENDITION_KIND_SHEET_SMALL = 8;
    // The same with 256 px cells.
    MEDIA_RENDITION_KIND_SHEET_LARGE = 9;
    // A VIDEO's short muted preview loop (#963): its first seconds, small
    // (an MP4 of at most ~300 KB), for a card that plays it in place, such
    // as a country's Shop cover. Absent when the video could not make one.
    MEDIA_RENDITION_KIND_PREVIEW     = 10;
}

// How a delivery URL is brokered. PUBLIC media gets a content-addressed, immutable
// CDN URL (cacheable forever — an edit is a new asset = a new hash = a new URL).
// SIGNED media gets a short-lived signed URL minted per request, only after the
// edge has authorized the viewer.
enum DeliveryVisibility {
    MEDIA_DELIVERY_VISIBILITY_UNSPECIFIED = 0;
    MEDIA_DELIVERY_VISIBILITY_PUBLIC      = 1;
    MEDIA_DELIVERY_VISIBILITY_SIGNED      = 2;
}
