syntax = "proto3";

package timeline.v1;

import "timeline/v1/enums.proto";

// A single slot in a user's following feed.
//
// Intentionally minimal: only the identifiers needed for BFF hydration.
// The BFF fetches rendering metadata (title, thumbnail, author handle,
// avatar) from services/post and services/profile using these identifiers.
// The timeline service never stores or forwards post content.
message FeedItem {
    // UUID v7 of the post. Used by BFF to call services/post for metadata.
    string post_id       = 1;
    // UUID of the post's author. Used by BFF to call services/profile.
    string author_id     = 2;
    // Unix epoch milliseconds of publication. Drives client-side sort order.
    int64  published_at_ms = 3;
}

// Request for a page of the caller's following feed.
message GetFollowingFeedRequest {
    // UUID of the authenticated profile requesting their feed.
    string profile_id  = 1;
    // Maximum number of items to return. Server clamps to TIMELINE_MAX_PAGE_SIZE.
    int32  limit       = 2;
    // Opaque cursor from the previous response's next_page_token.
    // Omit or send empty string for the first page.
    string page_token  = 3;
}

// Response containing one page of the following feed.
message GetFollowingFeedResponse {
    repeated FeedItem items           = 1;
    // Opaque cursor for the next page. Empty when no more items exist.
    string            next_page_token = 2;
    // True when the feed was served from ScyllaDB cold storage rather than
    // Redis. The client may use this to show a loading indicator on subsequent
    // requests while the Redis cache is warming asynchronously.
    bool              is_cold         = 3;
}

// Generic command acknowledgement.
message CommandResponse {
    bool   success = 1;
    string message = 2;
}

// A single slot in an audio-scoped feed.
message AudioFeedItem {
    string post_id         = 1;
    string author_id       = 2;
    int64  published_at_ms = 3;
}

// Request for a page of posts that use a given audio track.
message GetAudioFeedRequest {
    string audio_id   = 1;
    int32  limit      = 2;
    // Opaque cursor from the previous response's next_token.
    // Omit or send empty string for the first page.
    string page_token = 3;
}

// Response containing one page of the audio feed.
message GetAudioFeedResponse {
    repeated AudioFeedItem items      = 1;
    // Opaque cursor for the next page. Empty when no more items exist.
    string                 next_token = 2;
}

// Request for a page of the discovery feed (For You, Trending, Recent, Nearby).
//
// The reader is the caller's token (a member, or a guest session), never a
// request field: posts by authors the reader may not see (private profile not
// followed, block, hidden profile) are left out.
message GetDiscoveryFeedRequest {
    DiscoveryRanking ranking       = 1;
    // ISO 3166-1 alpha-2 country the client is browsing from. Accepted for
    // forward compatibility: v1 ranks one global pool (see region_applied).
    string           region        = 2;
    // Required for NEARBY (WGS-84), ignored otherwise.
    optional double  lat           = 3;
    optional double  lng           = 4;
    // Guests always get RESTRICTED.
    ContentLevel     content_level = 5;
    // Opaque cursor from the previous response's next_page_token, for the same
    // ranking. Omit or send empty for the first page.
    string           page_token    = 6;
    // Server clamps to TIMELINE_MAX_PAGE_SIZE; <= 0 means 20.
    int32            limit         = 7;
    // The reading profile (one of the caller's): its interest tags rank a
    // FOR_YOU page. Empty = not personalised (a guest always is).
    string           profile_id    = 8;
    // The holder's non-personalised feed setting (#662, profile
    // FeedSettings.non_personalized): set, interest tags are ignored.
    bool             non_personalized = 9;
}

message GetDiscoveryFeedResponse {
    // Identifiers only, as for the following feed: the client hydrates through
    // post.GetPost. A post can come back on a later page when it moves between
    // rankings (a fresh post gaining popularity): de-duplicate by post_id.
    repeated FeedItem items                 = 1;
    // Empty when the pool is exhausted. A page can hold fewer items than asked
    // (even none) with a non-empty token: keep paging.
    string            next_page_token       = 2;
    // The region the ranking was computed for; empty = global (v1 always).
    string            region_applied        = 3;
    // The content level actually applied.
    ContentLevel      content_level_applied = 4;
    // Whether the reader's interest tags ranked this page.
    bool              personalized          = 5;
}

// ── Interest tags (#662) ────────────────────────────────────────────────────

// One interest tag (a hashtag, lowercase, without its '#') and its weight
// today.
message Interest {
    string tag    = 1;
    double weight = 2;
}

message InterestsResponse {
    // Heaviest first.
    repeated Interest interests = 1;
}

message ListInterestsRequest {
    string profile_id = 1;
}

message RemoveInterestRequest {
    string profile_id = 1;
    // As listed (a leading '#' is accepted).
    string tag        = 2;
}

message ResetInterestsRequest {
    string profile_id = 1;
}
