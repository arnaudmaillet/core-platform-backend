syntax = "proto3";

package geo_discovery.v1;

import "geo_discovery/v1/messages.proto";

service GeoDiscoveryService {
    // Radar (Step 1): returns lightweight pins visible within the viewport at the
    // given zoom level. Hot path, served exclusively from Redis (spatial ZSETs +
    // pin projection). No ScyllaDB, no card hydration — built for high-frequency
    // pan/zoom. Fail-open: a missing pin is silently dropped.
    rpc QueryTile      (QueryTileRequest)      returns (QueryTileResponse);

    // Focus (Step 2): hydrates one or more focused pins into full cards (author
    // metadata, caption, tier). Batched for bottom-sheet cluster expansion. Reads
    // Redis, falls back to ScyllaDB on cache miss — the cold path the Radar pan
    // path avoids.
    rpc GetGeoTimeline (GetGeoTimelineRequest) returns (GetGeoTimelineResponse);

    // Country access from location: the device sends the country it derived
    // from its location (an ISO code, never a coordinate); the server grants it
    // only when the request's network (GeoIP) is in that country or a
    // neighbouring one. A guest session's map (QueryTile, GetGeoTimeline) shows
    // only its granted country, and nothing without one. Call it at launch and
    // at each foreground; an empty current_country (location off) closes it.
    // Members are limited by their unlocks instead (GetCountryUnlocks).
    rpc GetCountryAccess (GetCountryAccessRequest) returns (GetCountryAccessResponse);

    // The country ladder (#665): every country the map draws, ranked by the
    // likes on posts published there over the last 30 days (ties by country
    // code), with what unlocking it costs in gems by rank (1–10: 50, 11–30:
    // 30, beyond: 15). Returned whole (≈ 240 rows); the same for every
    // reader, refreshed at most every minute. A member's home country costs 0.
    rpc GetCountryStandings (GetCountryStandingsRequest) returns (GetCountryStandingsResponse);

    // A member's countries (#665): the home country (free: the account's
    // country of residence, else the network's country at the first visit,
    // kept for good) and those unlocked with gems. When the member map
    // filter is on (`filtering`), QueryTile and GetGeoTimeline show only
    // posts in these countries (and at sea). Edge: the caller's account.
    rpc GetCountryUnlocks (GetCountryUnlocksRequest) returns (GetCountryUnlocksResponse);

    // Unlocks a country with gems, at the price the app showed: answered
    // in-band (UNLOCKED, ALREADY_UNLOCKED, INSUFFICIENT_GEMS, PRICE_CHANGED).
    // Charged at most once per country. GEO-3001 (PERMISSION_DENIED) under 18
    // or with an unknown age. Edge: the caller's account.
    rpc UnlockCountry (UnlockCountryRequest) returns (UnlockCountryResponse);
}
