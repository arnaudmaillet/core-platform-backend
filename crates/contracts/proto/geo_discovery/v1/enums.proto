syntax = "proto3";

package geo_discovery.v1;

// Map zoom level bands that control which H3 resolution and virality threshold
// the server applies. The client sends a raw zoom integer (0–15); the server
// maps it to one of these bands internally and applies the corresponding
// score floor.
//
// Band  → H3 resolution  → Tile area  → Virality floor
// LOW   → R5             → ~87 km²    → 500  (continental, viral only)
// MID   → R7             → ~5 km²     → 50   (metro, high-traffic)
// HIGH  → R7             → ~5 km²     → 5    (neighborhood, broad)
// MICRO → R9             → ~0.1 km²   → 0    (street level, all posts)
enum ZoomBand {
    ZOOM_BAND_UNSPECIFIED = 0;
    ZOOM_BAND_LOW         = 1; // Zoom 1–4:  continental
    ZOOM_BAND_MID         = 2; // Zoom 5–8:  metro
    ZOOM_BAND_HIGH        = 3; // Zoom 9–12: neighborhood
    ZOOM_BAND_MICRO       = 4; // Zoom 13–15: street level
}

// Tier classification for a post's author.
//
// Denormalized from services/profile into the MapPostCard projection so that
// the BFF can render static badge decorations (border colour, badge icon) on
// map pins without a secondary service call.
//
// Design note: dynamic viewer-relational state (is_friend, is_following) is
// intentionally ABSENT from this enum and from MapPostCard. Those signals are
// resolved client-side by comparing author_id against the user's session-cached
// social graph (fetched once at login from services/social-graph). This avoids
// O(users × posts) Redis variants and preserves the shared-card cache model.
enum AuthorTier {
    AUTHOR_TIER_UNSPECIFIED = 0; // Alias for Standard; safe zero-value default
    AUTHOR_TIER_STANDARD    = 1;
    AUTHOR_TIER_PREMIUM     = 2;
    AUTHOR_TIER_VIP         = 3;
}

// What became of a device's current country.
enum CountryAccessOutcome {
    COUNTRY_ACCESS_OUTCOME_UNSPECIFIED  = 0;
    // The network is in that country, or a neighbouring one: open.
    COUNTRY_ACCESS_OUTCOME_GRANTED      = 1;
    // No current country was sent: nothing opens from location.
    COUNTRY_ACCESS_OUTCOME_NOT_SENT     = 2;
    // The network is in another, non-neighbouring country.
    COUNTRY_ACCESS_OUTCOME_MISMATCH     = 3;
    // The network's country is unknown: nothing could be verified.
    COUNTRY_ACCESS_OUTCOME_UNVERIFIABLE = 4;
}

// What became of an unlock (#665).
enum UnlockCountryOutcome {
    UNLOCK_COUNTRY_OUTCOME_UNSPECIFIED       = 0;
    UNLOCK_COUNTRY_OUTCOME_UNLOCKED          = 1;
    // The home country, or unlocked before: nothing charged.
    UNLOCK_COUNTRY_OUTCOME_ALREADY_UNLOCKED  = 2;
    // `price_gems` is what it costs, `gems` what the wallet holds.
    UNLOCK_COUNTRY_OUTCOME_INSUFFICIENT_GEMS = 3;
    // The rank moved since the app showed the price: `price_gems` is the new
    // one. Nothing charged; ask again with it.
    UNLOCK_COUNTRY_OUTCOME_PRICE_CHANGED     = 4;
}

// What became of a 24 h visa purchase (#910).
enum CountryVisaOutcome {
    COUNTRY_VISA_OUTCOME_UNSPECIFIED       = 0;
    // The visa runs until `expires_at` (24 h more than its previous end, or
    // than now).
    COUNTRY_VISA_OUTCOME_GRANTED           = 1;
    // The home country, or unlocked for good: no visa, nothing charged.
    COUNTRY_VISA_OUTCOME_ALREADY_UNLOCKED  = 2;
    // `price_gems` is what it costs, `gems` what the wallet holds.
    COUNTRY_VISA_OUTCOME_INSUFFICIENT_GEMS = 3;
    // The rank moved since the app showed the price: `price_gems` is the new
    // one. Nothing charged; ask again with it.
    COUNTRY_VISA_OUTCOME_PRICE_CHANGED     = 4;
}

// The order of a place page (#833).
enum PlaceSort {
    // RECENT.
    PLACE_SORT_UNSPECIFIED = 0;
    // Newest first.
    PLACE_SORT_RECENT      = 1;
    // By virality score (the map's popularity), ties to the newest.
    PLACE_SORT_POPULAR     = 2;
}

// The size of the place around a point (#833): the H3 cell the map indexes
// at that resolution.
enum PlaceScale {
    // CITY.
    PLACE_SCALE_UNSPECIFIED = 0;
    // An R5 cell (~250 km²): a city and its surroundings.
    PLACE_SCALE_CITY        = 1;
    // An R7 cell (~5 km²): a district.
    PLACE_SCALE_DISTRICT    = 2;
    // An R9 cell (~0.1 km²): a street.
    PLACE_SCALE_STREET      = 3;
}

// Which posts a list keeps by kind (#949): the full-screen feed keeps the
// opening post's kind. A post whose kind the service has not recorded (one
// published before it did) passes every filter.
enum PostKindFilter {
    // Every post.
    POST_KIND_FILTER_UNSPECIFIED = 0;
    // Photo, carousel and video posts.
    POST_KIND_FILTER_MEDIA       = 1;
    // Text-only posts.
    POST_KIND_FILTER_TEXT_ONLY   = 2;
}
