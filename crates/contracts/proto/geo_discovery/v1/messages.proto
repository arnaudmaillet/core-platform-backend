syntax = "proto3";

package geo_discovery.v1;

import "geo_discovery/v1/enums.proto";
import "google/protobuf/timestamp.proto";

// ── Shared geometry ───────────────────────────────────────────────────────────

// Axis-aligned bounding box describing the client's current map viewport.
// SW (south-west) is the bottom-left corner; NE (north-east) is the top-right.
// Coordinates are WGS-84 decimal degrees.
message Viewport {
    double sw_lat = 1; // [-90, 90]
    double sw_lng = 2; // [-180, 180]
    double ne_lat = 3; // [-90, 90]
    double ne_lng = 4; // [-180, 180]
}

// ── Radar pin (Step 1: map browsing / panning) ───────────────────────────────

// Lightweight map pin. The bare minimum required to render a marker on the map
// during pan/zoom (the high-frequency "Radar" path). Served exclusively from
// the Redis pin projection — no card hydration, no ScyllaDB, no author metadata.
//
// Clients enrich a pin on demand via GetGeoTimeline when the user taps it
// (the "Focus" path).
message RadarPin {
    string post_id       = 1;
    double lat           = 2; // Exact post location, WGS-84 [-90, 90]
    double lng           = 3; // Exact post location, WGS-84 [-180, 180]
    string thumbnail_url = 4; // Pin cover image; empty for text-only posts
}

// ── Map card ─────────────────────────────────────────────────────────────────

// Fully hydrated map card. Contains all data required by the BFF to render a
// map pin and its associated card preview — no secondary service calls needed.
//
// Badge rendering contract:
//   - author_tier drives STATIC badge decoration (VIP gold border, Premium purple border).
//     This is author-owned and viewer-independent — the same card is shared by all viewers.
//   - is_friend / is_following are intentionally absent. Clients resolve these locally
//     by intersecting author_id with their session-cached social graph sets, fetched
//     once at login from services/social-graph. Zero extra server round-trips per pan.
message MapPostCard {
    string     post_id           = 1;
    string     author_id         = 2;
    string     author_handle     = 3;
    string     author_avatar_url = 4;
    string     thumbnail_url     = 5;
    // Raw H3 cell index (uint64 cast to int64) at resolution 7.
    // Clients use this for deep-link map centering.
    int64      h3_index_r7       = 6;
    float      virality_score    = 7;
    // Unix epoch milliseconds.
    int64      published_at_ms   = 8;
    // Static author tier. Denormalized from services/profile at index time and
    // kept current via the TierSyncWorker (profile.tier_changed Kafka topic).
    // Defaults to AUTHOR_TIER_UNSPECIFIED (= Standard) for ungated legacy cards.
    AuthorTier author_tier       = 9;
    // Post caption, denormalized from PostPublished. Served only on the Focus
    // path (GetGeoTimeline) — never on the Radar pan path. Empty when absent.
    string     caption           = 10;
}

// ── QueryTile ─────────────────────────────────────────────────────────────────

message QueryTileRequest {
    Viewport viewport   = 1;
    // Raw client zoom level (0–15). The server maps this to a ZoomBand and
    // applies the corresponding H3 resolution and virality floor.
    int32    zoom_level = 2;
    // Mesh only (ignored on the client edge, where the caller's own token
    // decides): the guest principal (token sub) a mesh caller reads on behalf
    // of, so the guest's country limit applies (timeline's NEARBY feed).
    string   guest_principal = 3;
}

message QueryTileResponse {
    // Field 1 previously held `repeated MapPostCard cards`. The Radar/Focus split
    // replaced it with lightweight pins on a fresh field number rather than
    // repurposing field 1, keeping the change wire/JSON-compatible (buf WIRE_JSON).
    reserved 1;
    reserved "cards";
    // Number of H3 tile partitions queried. Useful for client-side telemetry
    // (viewport too wide → cache expensive).
    int32                tile_count = 2;
    // Lightweight pins only. Radar/Focus split: the pan path returns markers,
    // not hydrated cards. Clients hydrate on tap via GetGeoTimeline.
    repeated RadarPin    pins       = 3;
}

// ── GetGeoTimeline (Step 2: pin focus / bottom-sheet expansion) ───────────────

// Targeted enrichment for one or more pins the user has focused. Batched so a
// bottom-sheet can expand a cluster in a single round-trip. Reads the hydrated
// card from Redis, falling back to ScyllaDB on cache miss — the cold-read path
// that the Radar pan path deliberately avoids.
message GetGeoTimelineRequest {
    repeated string post_ids = 1;
}

message GetGeoTimelineResponse {
    // Cards for the post_ids that resolved, in arbitrary order. Unresolved ids
    // (expired / never indexed) are simply absent.
    repeated MapPostCard cards = 1;
}

// ── ListPlacePosts (#833: the place page of a city / country marker) ──────────

// A point and the size of the place around it.
message PlacePoint {
    double     lat   = 1; // WGS-84 [-90, 90]
    double     lng   = 2; // WGS-84 [-180, 180]
    PlaceScale scale = 3;
}

message ListPlacePostsRequest {
    oneof place {
        // A raw H3 cell index (uint64 cast to int64) at resolution 5, 7 or 9,
        // as `MapPostCard.h3_index_r7` carries one. Another resolution:
        // GEO-1002.
        int64      h3_cell      = 1;
        // An ISO 3166-1 alpha-2 country code, as the country ladder names it.
        string     country_code = 2;
        // The cell around a point (a city marker's centre).
        PlacePoint point        = 3;
    }
    // RECENT by default. POPULAR ranks the place's 200 newest posts by
    // virality, then carries on with the older ones newest first.
    PlaceSort sort       = 4;
    // At most 50; 0 means 20.
    int32     limit      = 5;
    // The previous response's `next_page_token`, with the same place and sort.
    string    page_token = 6;
    // Only posts of this kind (#949); UNSPECIFIED keeps all.
    PostKindFilter post_kind = 7;
}

message ListPlacePostsResponse {
    // In the requested order, as the reader may see them (the same rules as
    // GetGeoTimeline: a guest's country, a member's countries, ghosts and
    // city-level authors, the reader's audience). A page can come back short
    // with a token: keep paging until the token is empty.
    repeated MapPostCard cards           = 1;
    // Empty on the last page. Pages resume after the last post of the
    // previous one, so new posts never shift a RECENT listing; a POPULAR
    // page reads the ranking again, so a post whose score moves between
    // pages can show twice or be passed over: de-duplicate by post_id.
    string               next_page_token = 2;
}

// ── Country access ────────────────────────────────────────────────────────────

message GetCountryAccessRequest {
    // ISO 3166-1 alpha-2, derived on the device from its location. Empty when
    // location is off or unavailable.
    string current_country = 1;
}

message GetCountryAccessResponse {
    // The current country, echoed only when granted; empty otherwise.
    string               current_country = 1;
    CountryAccessOutcome outcome         = 2;
}

// ── Country standings (#665) ──────────────────────────────────────────────────

message GetCountryStandingsRequest {}

message CountryStanding {
    // ISO 3166-1 alpha-2.
    string country_code = 1;
    // 1 = most liked.
    int32  rank         = 2;
    // Likes on posts published there, over the window.
    int64  likes        = 3;
    // Posts published there, over the window.
    int64  posts        = 4;
    // What unlocking it costs, in gems.
    int64  price_gems   = 5;
    // What a 24 h visa to it costs, in gems (#910).
    int64  visa_price_gems = 6;
}

message GetCountryStandingsResponse {
    // Every country, busiest first.
    repeated CountryStanding  standings   = 1;
    google.protobuf.Timestamp computed_at = 2;
}

// ── Country unlocks (#665) ────────────────────────────────────────────────────

message GetCountryUnlocksRequest {
    string account_id = 1;
}

message GetCountryUnlocksResponse {
    // ISO 3166-1 alpha-2; empty when it could not be told yet.
    string          home_country       = 1;
    // Home included.
    repeated string unlocked_countries = 2;
    // The wallet's gems, so the shop's balance line is one read.
    int64           gems               = 3;
    // The member map filter is on: the map shows only these countries (and
    // `visas`' until they end).
    bool            filtering          = 4;
    // The running 24 h visas (#910), of countries not unlocked for good.
    repeated CountryVisa visas         = 5;
}

// A running 24 h visa (#910).
message CountryVisa {
    // ISO 3166-1 alpha-2.
    string                    country_code = 1;
    // When the country leaves the map again (the server stops it then).
    google.protobuf.Timestamp expires_at   = 2;
}

message UnlockCountryRequest {
    string account_id     = 1;
    string country_code   = 2;
    // The price the app showed.
    int64  expected_price = 3;
}

message UnlockCountryResponse {
    UnlockCountryOutcome outcome            = 1;
    // Home included.
    repeated string      unlocked_countries = 2;
    int64                gems               = 3;
    // The country's current price.
    int64                price_gems         = 4;
}

message BuyCountryVisaRequest {
    string account_id      = 1;
    string country_code    = 2;
    // The visa price the app showed (`CountryStanding.visa_price_gems`).
    int64  expected_price  = 3;
    // Client-generated (8–40 characters: letters, digits, `-`, `_`), a new
    // one per purchase. A retry with the same key charges at most once and
    // grants the same end.
    string idempotency_key = 4;
}

message BuyCountryVisaResponse {
    CountryVisaOutcome        outcome    = 1;
    // The running visas after the call.
    repeated CountryVisa      visas      = 2;
    int64                     gems       = 3;
    // The visa's current price (the agreed one for a retried purchase).
    int64                     price_gems = 4;
    // GRANTED: when this country's visa ends.
    google.protobuf.Timestamp expires_at = 5;
}

// ── Continents (#912) ─────────────────────────────────────────────────────────

message ListContinentsRequest {}

message Continent {
    // `AF`, `AN`, `AS`, `EU`, `NA`, `OC` or `SA`; the app names it.
    string          continent_code = 1;
    // Its badge's wallet item id (`badge.continent_eu`).
    string          badge_id       = 2;
    // ISO 3166-1 alpha-2, every country of the map on it.
    repeated string country_codes  = 3;
}

message ListContinentsResponse {
    repeated Continent continents = 1;
}
