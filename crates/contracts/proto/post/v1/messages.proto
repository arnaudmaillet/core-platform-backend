syntax = "proto3";

package post.v1;

import "post/v1/enums.proto";

message AudioReference {
    string    audio_id   = 1;
    AudioKind audio_kind = 2;
}

// Client-supplied post location (WGS-84 decimal degrees). Optional on a post.
// Denormalized onto post.published so geo-discovery can spatially index the post.
message GeoPoint {
    double lat = 1; // [-90, 90]
    double lng = 2; // [-180, 180]
}

message MediaAttachmentInput {
    string cdn_url          = 1;
    string mime_type        = 2;
    uint32 width            = 3;
    uint32 height           = 4;
    string thumbnail_url    = 5;
    float  duration_seconds = 6;
}

message MediaAttachmentView {
    string cdn_url          = 1;
    string mime_type        = 2;
    uint32 width            = 3;
    uint32 height           = 4;
    string thumbnail_url    = 5;
    float  duration_seconds = 6;
}

message PostView {
    string     post_id                          = 1;
    string     profile_id                       = 2;
    PostKind   kind                             = 3;
    PostStatus status                           = 4;
    string     caption                          = 5;
    repeated MediaAttachmentView attachments    = 6;
    string     parent_id                        = 7;
    string     root_id                          = 8;
    int64      created_at_ms                    = 9;
    int64      updated_at_ms                    = 10;
    int64      published_at_ms                  = 11;
    int64      deleted_at_ms                    = 12;
    optional AudioReference audio_ref           = 13;
    // As the author shares it with this reader: the point for the author,
    // the centre of its city cell (city level) or absent (ghost mode) for anyone else.
    optional GeoPoint       location            = 14;
    ModerationRestriction   moderation          = 15;
    // The post's own reuse permission (#669); unset = the author's default.
    optional bool           allow_remix         = 16;
    optional bool           allow_sound_reuse   = 17;
    // Mesh reads only: older than its author's post window (#664). Clients
    // other than the author get NOT_FOUND instead, so a mesh caller serving
    // clients (comments, search) must withhold the post too.
    bool                    outside_window      = 18;
    // Mesh reads only: when the post leaves its author's post window (#664),
    // created_at + the window; 0 without a window. A read model serving clients
    // (search) stores it to withhold the post once that time passes.
    int64                   visible_until_ms    = 19;
    // The author turned downloads off (#809): the reader (anyone but the
    // author) is not offered to save the post's media.
    bool                    downloads_disabled  = 20;
    // The author hides like counts from this reader (#809): counts are
    // withheld (engagement, counter); the app shows none.
    bool                    like_counts_hidden  = 21;
}

message BatchGetLikeVisibilityRequest {
    repeated string post_ids = 1;
}

message PostLikeVisibility {
    string post_id            = 1;
    string author_id          = 2;
    bool   like_counts_hidden = 3;
}

message BatchGetLikeVisibilityResponse {
    repeated PostLikeVisibility posts = 1;
}

message PostSummary {
    string     post_id      = 1;
    PostKind   kind         = 2;
    PostStatus status       = 3;
    int64      created_at_ms = 4;
    ModerationRestriction moderation = 5;
    // A repost (it has a parent), and whether it carries a place (#829).
    bool       is_repost    = 6;
    bool       has_place    = 7;
}

message CommandResponse {
    bool   success = 1;
    string message = 2;
}

message CreatePostRequest {
    string     profile_id                    = 1;
    PostKind   kind                          = 2;
    string     caption                       = 3;
    repeated MediaAttachmentInput attachments = 4;
    string     parent_id                     = 5;
    string     root_id                       = 6;
    optional AudioReference audio_ref        = 7;
    optional GeoPoint       location         = 8;
    // This post's own remix / original-sound reuse permission (#669); absent
    // follows the author's profile default.
    optional bool           allow_remix       = 9;
    optional bool           allow_sound_reuse = 10;
    // Optional, client-generated, one per post and reused on every retry
    // (8–64 characters: letters, digits, `-`, `_`; PST-9006 otherwise). A
    // repeated key from the same profile, within 24 hours, creates nothing and
    // answers the post the first call created. While that first call is still
    // in flight a repeat fails ABORTED (PST-1010): retry it. Empty: no
    // deduplication.
    string                  idempotency_key   = 11;
}

message CreatePostResponse {
    // The created post; on a repeated idempotency key, the first call's.
    string post_id    = 1;
    string profile_id = 2;
}

message PublishPostRequest {
    string post_id    = 1;
    string profile_id = 2;
}

message UpdatePostRequest {
    string post_id                           = 1;
    string profile_id                        = 2;
    string caption                           = 3;
    repeated MediaAttachmentInput attachments = 4;
}

message DeletePostRequest {
    string post_id    = 1;
    string profile_id = 2;
}

// Bring a deleted post back within 30 days of its deletion (its author):
// published again or a draft again. PST-1006 if not deleted, PST-1007 after
// 30 days.
message RestorePostRequest {
    string post_id    = 1;
    string profile_id = 2;
}

// The author's deleted posts still restorable (30 days after deleted_at_ms),
// newest deletion first.
message ListRecentlyDeletedRequest {
    string profile_id = 1;
    int32  limit      = 2;
    string page_token = 3;
}

message ListRecentlyDeletedResponse {
    repeated PostView posts      = 1;
    string            next_token = 2;
}

message GetPostRequest {
    string post_id = 1;
    // Mesh only (the GDPR data export, #653): read the post as its author —
    // the location as the author sees it, whatever their sharing (#657).
    // Honoured only from a mesh caller and only when it names the post's
    // author; ignored on the edge.
    string as_author_id = 2;
}

message ListPostsByProfileRequest {
    string          profile_id  = 1;
    int32           limit       = 2;
    string          page_token  = 3;
    // Unspecified: every post (#829).
    ProfilePostsTab tab         = 4;
}

message ListPostsByProfileResponse {
    repeated PostSummary posts      = 1;
    string               next_token = 2;
}
