syntax = "proto3";

package wallet.v1;

import "wallet/v1/messages.proto";

option java_package = "com.coreplatform.wallet.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/wallet/v1;walletv1";

// WalletService is the in-app economy's ledger (#665): an account's points
// (likes) and gems, every movement recorded. Nothing here is bought with real
// money. A wallet is opened on first use, with the starter gems.
//
// TIER-0, fail-closed: when the ledger cannot be written, the call fails —
// a balance is never guessed. Edge: the caller's own account (`account_id`).
service WalletService {
    // The caller's wallet.
    rpc GetWallet(GetWalletRequest) returns (Wallet);

    // Claims the hourly reward: 25 points, +10 % per consecutive UTC day up to
    // ×2, at most 200 points per UTC day, one claim per hour. Idempotent per
    // `idempotency_key`.
    rpc ClaimReward(ClaimRewardRequest) returns (ClaimRewardResponse);

    // The caller's transaction history, newest first.
    rpc ListWalletTransactions(ListWalletTransactionsRequest) returns (ListWalletTransactionsResponse);

    // Buys a stake pack with gems (#941): `pack_id` names one of
    // `Wallet.stake_packs` (empty = the default pack: 3 shots of 100 of the
    // caller's own points for 50 gems), all or nothing, one pack at a time
    // (PACK_STILL_ACTIVE while shots are left). WAL-3001 (PERMISSION_DENIED)
    // for a caller under 18 or of unknown age; WAL-9005 (INVALID_ARGUMENT)
    // for a pack not on sale.
    rpc BuyStakePack(BuyStakePackRequest) returns (BuyStakePackResponse);

    // Commits a batch of likes on a post or a comment (#665: a like is a
    // point): taps are batched on the device and sent when the viewer moves
    // on, the app goes to the background, or 10 s after the last tap, then
    // retried with the same key until answered (24 h at most). The server
    // rechecks everything at commit: a plain batch is clamped to the target's
    // room (250 points per account and target), the balance and the hour's
    // room (1,000 points); a shot is whole or refused. Never on one's own
    // content. Final: no unlike. Answered in-band (StakeOutcome). Edge: the
    // caller's account and one of its profiles.
    rpc Stake(StakeRequest) returns (StakeResponse);

    // Mesh only: another service spends an account's gems (geo-discovery's
    // country unlocks and 24 h visas: kind COUNTRY_UNLOCK or COUNTRY_VISA;
    // profile's slots: PROFILE_SLOT). The caller checks the spender may spend gems (an
    // adult); the wallet records the movement. Idempotent per key.
    rpc SpendGems(SpendGemsRequest) returns (SpendGemsResponse);

    // Mesh only: the account's wallet for its GDPR data export (#653, #665),
    // read without opening one (absent when it never had one).
    rpc ExportWallet(ExportWalletRequest) returns (ExportWalletResponse);

    // Mesh only: the account's stake positions — each post or comment it
    // staked on, and the position's settlement once it settled — paged by
    // target, for the GDPR data export.
    rpc ListStakePositions(ListStakePositionsRequest) returns (ListStakePositionsResponse);

    // The caller's own stakes, for the wallet sheet (#886): each post or
    // comment it staked on, active (with when it settles) or settled (with the
    // day's verdict), newest first, paged. Edge: the caller's account. While
    // settlement is shadow mode no gems are shown — the app never displays gems
    // the balance does not hold.
    rpc ListMyStakes(ListMyStakesRequest) returns (ListMyStakesResponse);

    // The gem catalogue (#892): every item on sale and its price (server
    // policy), in display order. A free item (price 0) is owned by every
    // account. The app bundles each item's art keyed by its id and hides an
    // id it does not know. Edge: any member.
    rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse);

    // Buys a catalogue item with gems (#892): idempotent per key, at
    // `expected_price` (PRICE_CHANGED otherwise), one ledger row of the item
    // family's kind (`ref_id` = the item id); the account then owns it.
    // Answered in-band (PurchaseOutcome). WAL-3001 (PERMISSION_DENIED) for a
    // caller under 18 or of unknown age. Edge: the caller's account.
    rpc PurchaseItem(PurchaseItemRequest) returns (PurchaseItemResponse);

    // The items the caller's account owns (#892), free ones included: the
    // app gates its pickers on it. Which item is applied (an icon, a theme)
    // is a device setting the server neither stores nor serves. Edge: the
    // caller's account.
    rpc ListOwnedItems(ListOwnedItemsRequest) returns (ListOwnedItemsResponse);
}
