syntax = "proto3";

package wallet.v1;

import "google/protobuf/timestamp.proto";
import "wallet/v1/enums.proto";

option java_package = "com.coreplatform.wallet.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/wallet/v1;walletv1";

// An account's wallet: both balances and everything the claim surface needs,
// computed by the server's clock (the app never decides eligibility itself).
message Wallet {
    string                    account_id      = 1;
    // Spendable points (likes), never negative.
    int64                     points          = 2;
    // Spendable gems, never negative.
    int64                     gems            = 3;
    int64                     points_earned   = 4;
    int64                     points_spent    = 5;
    int64                     gems_earned     = 6;
    int64                     gems_spent      = 7;

    // ── The hourly claim ─────────────────────────────────────────────────────
    bool                      claim_available = 8;
    // When the next claim opens; unset while `claim_available`.
    google.protobuf.Timestamp next_claim_at   = 9;
    // What the next claim pays (streak multiplier, daily cap and the room
    // under `points_cap` applied).
    int32                     claim_amount    = 10;
    // Points claimed in the current UTC day.
    int32                     claimed_today   = 11;
    int32                     daily_claim_cap = 12;
    // Consecutive UTC days with a claim; 0 once the chain has lapsed.
    int32                     streak_days     = 13;
    google.protobuf.Timestamp last_claim_at   = 14;

    // Shots left in the stake pack; 0 = none.
    int32                     stake_shots     = 15;

    // The caller may not spend gems (under 18, or age unknown): hide the
    // stake pack and the country unlocks. Set on the edge only.
    bool                      gem_spending_restricted = 16;
    // The default stake pack's terms (server policy): the first of
    // `stake_packs`, kept for clients that predate several packs.
    int64                     stake_pack_price        = 17;
    int32                     stake_pack_shots        = 18;
    // Points per shot, for every pack.
    int32                     points_per_shot         = 19;

    // The points balance a claim never takes past (server policy): a claim is
    // clamped to what fits, and at the cap `claim_available` is false with no
    // `next_claim_at` (ClaimReward answers CLAIM_OUTCOME_BALANCE_FULL).
    int64                     points_cap              = 20;

    // The probability each conviction level C1–C4 stands for (#888, server
    // policy; C1 first): shown when the curator picks a level.
    repeated double           conviction_probabilities = 21;

    // The stake packs on sale (#941, server policy), the default pack first.
    repeated StakePackOffer   stake_packs             = 22;
    // The pack the `stake_shots` left came from; empty when none are left.
    string                    stake_pack_id           = 23;
}

// One stake pack on sale (#941).
message StakePackOffer {
    // Stable id, `shots_<shots>` (e.g. `shots_10`); BuyStakePack names it.
    string pack_id = 1;
    int32  shots   = 2;
    // In gems.
    int64  price   = 3;
}

message GetWalletRequest {
    string account_id = 1;
}

message ClaimRewardRequest {
    string account_id      = 1;
    // Client-generated (8–64 characters: letters, digits, `-`, `_`). A retry
    // with the same key credits at most once and answers CLAIMED again.
    string idempotency_key = 2;
}

message ClaimRewardResponse {
    ClaimOutcome outcome = 1;
    // Points credited by this claim; 0 unless CLAIMED.
    int32        awarded = 2;
    // The wallet after the call.
    Wallet       wallet  = 3;
}

// One movement of one balance.
message WalletTransaction {
    string                    transaction_id = 1;
    Currency                  currency       = 2;
    // Positive: credited; negative: spent.
    int64                     delta          = 3;
    // That balance right after.
    int64                     balance_after  = 4;
    TransactionKind           kind           = 5;
    google.protobuf.Timestamp created_at     = 6;
    // What it was for, when it names something (COUNTRY_UNLOCK: the country;
    // STAKE_PACK: the pack id, empty before #941).
    string                    ref_id         = 7;
}

message ListWalletTransactionsRequest {
    string   account_id = 1;
    // Unspecified: both currencies.
    Currency currency   = 2;
    // Default 50, capped at 100.
    int32    page_size  = 3;
    // Opaque cursor from a previous response; empty for the first page.
    string   page_token = 4;
}

message BuyStakePackRequest {
    string account_id      = 1;
    // As for ClaimReward: a retry with the same key charges at most once.
    string idempotency_key = 2;
    // One of `Wallet.stake_packs` (#941); empty = the default pack. A
    // `pack_id` not on sale is WAL-9005 (INVALID_ARGUMENT).
    string pack_id         = 3;
}

message BuyStakePackResponse {
    StakePackOutcome outcome = 1;
    // The wallet after the call.
    Wallet           wallet  = 2;
}

message SpendGemsRequest {
    string          account_id      = 1;
    // Gems to spend, > 0.
    int64           amount          = 2;
    // What for: COUNTRY_UNLOCK or COUNTRY_VISA (#910), PROFILE_SLOT (#916).
    TransactionKind kind            = 3;
    // What it names (the country code), at most 64 characters.
    string          ref_id          = 4;
    // The calling service's key (8–64 characters: letters, digits, `-`,
    // `_`): a retry with the same key charges at most once.
    string          idempotency_key = 5;
}

message SpendGemsResponse {
    SpendGemsOutcome outcome = 1;
    // Gems left.
    int64            gems    = 2;
}

message StakeRequest {
    string account_id = 1;
    // Which of the caller's profiles likes (it is named on the like).
    string profile_id = 2;
    oneof target {
        string post_id    = 3;
        string comment_id = 4;
    }
    // Points to stake: the batch's taps (1 per tap). Ignored with a shot.
    int32  points          = 5;
    // Spend one shot of the ×100 pack instead (100 of the caller's points).
    bool   use_stake_shot  = 6;
    // One per batch (8–64 characters: letters, digits, `-`, `_`), kept with
    // the batch on the device: a retry with it stakes at most once.
    string idempotency_key = 7;
    // When the batch's first tap was made (the device's clock): a batch older
    // than 24 hours is EXPIRED.
    google.protobuf.Timestamp first_tap_at = 8;
    // How sure the curator is (#888): recorded with the batch, frozen, and
    // scored later; no effect on the stake. UNSPECIFIED: a quick stake.
    Conviction conviction = 9;
}

message StakeResponse {
    StakeOutcome outcome     = 1;
    // Points this batch moved (0 unless STAKED).
    int32        spent       = 2;
    // The caller's points on the target now (the heart is filled from 1).
    int32        my_total    = 3;
    // The wallet after the call (points, shots).
    Wallet       wallet      = 4;
}

message ListWalletTransactionsResponse {
    // Newest first.
    repeated WalletTransaction transactions    = 1;
    // Empty on the last page.
    string                     next_page_token = 2;
}

message ExportWalletRequest {
    string account_id = 1;
}

message ExportWalletResponse {
    // Absent: the account never opened a wallet.
    Wallet             wallet      = 1;
    // The catalogue items the account bought (#892); free ones are not listed.
    repeated OwnedItem owned_items = 2;
}

message ListStakePositionsRequest {
    string account_id = 1;
    // Default 100, capped at 500.
    int32  page_size  = 2;
    // The `next_page_token` of the previous page (empty: the first).
    string page_token = 3;
}

// An account's stakes on one post or comment (#665).
message StakePosition {
    oneof target {
        string post_id    = 1;
        string comment_id = 2;
    }
    // Points staked on it, all batches together.
    int64                     points     = 3;
    google.protobuf.Timestamp first_at   = 4;
    google.protobuf.Timestamp last_at    = 5;
    // Absent until it settles (a day after its first stake).
    StakeSettlement           settlement = 6;
    // The conviction of the position's first batch (#888); UNSPECIFIED for a
    // quick stake or a position from before.
    Conviction                first_conviction = 7;
}

// A position's settlement (shadow mode: the gems are provisional, never
// minted).
message StakeSettlement {
    google.protobuf.Timestamp settled_at          = 1;
    // The position's points when it settled.
    int64                     points              = 2;
    // The target's like count just before the account's first like (absent:
    // unknown), and when the position settled.
    optional int64            count_on_arrival    = 3;
    int64                     count_at_settlement = 4;
    optional double           earliness           = 5;
    optional double           pre_score           = 6;
    string                    model               = 7;
    // The day's envelope, once computed: the target in the day's top (1) or
    // not (0), the score, and the provisional gems.
    optional int32            outcome             = 8;
    optional double           score               = 9;
    optional int64            provisional_gems    = 10;
    // YYYY-MM-DD; empty until the day's envelope is computed.
    string                    envelope_day        = 11;
}

message ListStakePositionsResponse {
    repeated StakePosition positions       = 1;
    // Empty on the last page.
    string                 next_page_token = 2;
}

message ListMyStakesRequest {
    // The caller's account (edge: must be the token's).
    string            account_id = 1;
    StakeStatusFilter status     = 2;
    // Default 50, capped at 100.
    int32             page_size  = 3;
    // The `next_page_token` of the previous page (empty: the first).
    string            page_token = 4;
}

// One of the caller's stakes: all its likes on one post or comment (#886).
message MyStake {
    oneof target {
        string post_id    = 1;
        string comment_id = 2;
    }
    // Points staked on it, all batches together.
    int64                     points     = 3;
    google.protobuf.Timestamp first_at   = 4;
    google.protobuf.Timestamp last_at    = 5;
    // When it settles: a day after its first stake (server policy).
    google.protobuf.Timestamp settles_at = 6;
    // Set once settled.
    google.protobuf.Timestamp settled_at = 7;
    StakeVerdict              verdict    = 8;
}

message ListMyStakesResponse {
    // Newest first stake first.
    repeated MyStake stakes          = 1;
    // Empty on the last page.
    string           next_page_token = 2;
}

// One item of the gem catalogue (#892).
message CatalogItem {
    // `<family>.<name>`, e.g. `theme.violet`; stable, the app's art key.
    string     item_id = 1;
    ItemFamily family  = 2;
    // In gems; 0 = free, owned by every account.
    int64      price   = 3;
}

message ListCatalogRequest {}

message ListCatalogResponse {
    repeated CatalogItem items = 1;
}

message PurchaseItemRequest {
    string account_id      = 1;
    // As for ClaimReward: a retry with the same key charges at most once.
    string idempotency_key = 2;
    string item_id         = 3;
    // The price the app showed; another one answers PRICE_CHANGED.
    int64  expected_price  = 4;
}

message PurchaseItemResponse {
    PurchaseOutcome outcome = 1;
    // The wallet after the call.
    Wallet          wallet  = 2;
}

// A catalogue item an account owns.
message OwnedItem {
    string                    item_id     = 1;
    ItemFamily                family      = 2;
    // When it was bought; unset for a free item.
    google.protobuf.Timestamp acquired_at = 3;
}

message ListOwnedItemsRequest {
    string account_id = 1;
}

message ListOwnedItemsResponse {
    // Free items first, then the bought ones, oldest first.
    repeated OwnedItem items = 1;
}
