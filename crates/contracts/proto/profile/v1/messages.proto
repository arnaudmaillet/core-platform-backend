syntax = "proto3";

package profile.v1;

import "profile/v1/enums.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.coreplatform.profile.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/profile/v1;profilev1";

// ── Read models ───────────────────────────────────────────────────────────────

message ProfileLinkProto {
    string label = 1;
    string url   = 2;
}

message ProfileView {
    string                          profile_id        = 1;
    string                          account_id        = 2;
    string                          handle            = 3;
    string                          display_name      = 4;
    string                          bio               = 5;
    string                          avatar_url        = 6;
    string                          banner_url        = 7;
    string                          website_url       = 8;
    repeated ProfileLinkProto       custom_links      = 9;
    ProfileKind                     profile_kind      = 10;
    ProfileVisibility               visibility        = 11;
    bool                            verified          = 12;
    VerificationKind                verification_kind = 13;
    string                          locale            = 14;
    string                          timezone          = 15;
    ProfileStatus                   status            = 16;
    string                          masking_reason    = 17;
    google.protobuf.Timestamp       masked_at         = 18;
    google.protobuf.Timestamp       created_at        = 19;
    google.protobuf.Timestamp       updated_at        = 20;
    int64                           version           = 21;
    // Who may comment / mention / message, downloads, like counts.
    InteractionSettings             interaction_settings = 22;
    // Owner-only (unset for anyone else): ghost mode and location precision.
    LocationSettings                location_settings    = 23;
    // Owner-only (unset for anyone else): presence and discoverability.
    DiscoverySettings               discovery_settings   = 24;
    // Owner-only (unset for anyone else): hidden words, offensive filter.
    CommentFilters                  comment_filters      = 25;
    // Owner-only (unset for anyone else): post window, tab visibility.
    TabSettings                     tab_settings         = 26;
    // Owner-only (unset for anyone else): feed controls.
    FeedSettings                    feed_settings        = 27;
    // A brand's public contact card (#668); unset for other kinds.
    BusinessInfo                    business_info        = 28;
}

message ProfileSummaryView {
    string            profile_id   = 1;
    string            handle       = 2;
    string            display_name = 3;
    string            avatar_url   = 4;
    ProfileKind       profile_kind = 5;
    ProfileVisibility visibility   = 6;
    ProfileStatus     status       = 7;
}

message CommandResponse {
    bool   success    = 1;
    string profile_id = 2;
}

// ── Command request messages ──────────────────────────────────────────────────

message CreateProfileRequest {
    string      account_id   = 1;
    string      handle       = 2;
    string      display_name = 3;
    string      bio          = 4;
    string      avatar_url   = 5;
    string      banner_url   = 6;
    ProfileKind profile_kind = 7;
    string      locale       = 8;
}

message UpdateProfileRequest {
    string                    profile_id   = 1;
    string                    display_name = 2;
    string                    bio          = 3;
    string                    website_url  = 4;
    string                    locale       = 5;
    repeated ProfileLinkProto custom_links = 6;
}

message ChangeHandleRequest {
    string profile_id  = 1;
    string new_handle  = 2;
}

message UpdateAvatarRequest {
    string profile_id = 1;
    string avatar_url = 2;
}

message UpdateBannerRequest {
    string profile_id = 1;
    string banner_url = 2;
}

message SetVisibilityRequest {
    string            profile_id = 1;
    ProfileVisibility visibility = 2;
}

message VerifyProfileRequest {
    string           profile_id        = 1;
    VerificationKind verification_kind = 2;
}

message HideProfileRequest {
    string profile_id        = 1;
    MaskingReason masking_reason = 2;
    string suspension_reason = 3;
}

message RestoreProfileRequest {
    string profile_id = 1;
}

message DeleteProfileRequest {
    string profile_id = 1;
}

// ── Query request/response messages ──────────────────────────────────────────

message GetProfileByIdRequest {
    string profile_id = 1;
}

message GetProfileByHandleRequest {
    string handle = 1;
}

message CheckHandleAvailabilityRequest {
    string handle = 1;
}

message CheckHandleAvailabilityResponse {
    HandleAvailability availability   = 1;
    // The handle as it would be stored (lower-cased); empty when INVALID.
    string             handle         = 2;
    // Why the handle is INVALID (length, characters…); empty otherwise.
    string             invalid_reason = 3;
}

message ListProfilesByAccountRequest {
    string account_id  = 1;
    int32  limit       = 2;
    string page_token  = 3;
}

message ListProfilesByAccountResponse {
    repeated ProfileSummaryView profiles        = 1;
    string                      next_page_token = 2;
}

// A profile's interaction settings. Teen accounts (13–17) start with comments,
// mentions and messages from followers only and downloads off.
message InteractionSettings {
    InteractionAudience comments         = 1;
    InteractionAudience mentions         = 2;
    InteractionAudience messages         = 3;
    bool                allow_downloads  = 4;
    bool                show_like_counts = 5;
    // Whether others may remix this profile's posts / reuse their original
    // sound (#669; a post may override). Always set on a view; on a set
    // request, absent keeps the stored value.
    optional bool       allow_remix       = 6;
    optional bool       allow_sound_reuse = 7;
    // A temporary interaction limit, when one is on (view only; set it with
    // SetInteractionLimit).
    InteractionLimit    limit             = 8;
}

// While on (until until_ms), comments and messages from `audience` are held
// for the owner's review instead of shown (#669).
message InteractionLimit {
    LimitAudience audience = 1;
    int64         until_ms = 2;
}

// Turn a limit on: `until_ms` in the future, at most four weeks ahead.
message SetInteractionLimitRequest {
    string        profile_id = 1;
    LimitAudience audience   = 2;
    int64         until_ms   = 3;
}

message ClearInteractionLimitRequest {
    string profile_id = 1;
}

// The whole set at once (an UNSPECIFIED audience is refused).
message SetInteractionSettingsRequest {
    string              profile_id = 1;
    InteractionSettings settings   = 2;
}

// A profile's location sharing, applied by geo-discovery to every map surface.
// Teen accounts (13–17) start ghosted.
message LocationSettings {
    // Ghost mode: the profile's posts leave everyone else's map.
    bool              ghost        = 1;
    LocationPrecision precision    = 2;
    // Who sees the location when not a ghost (#657). Teens: mutuals.
    LocationAudience  audience     = 3;
    // The app adds the location to new posts by default (a stored preference;
    // the server never changes a post for it). On a set request, absent keeps
    // the stored value. Teens: off.
    optional bool     on_new_posts = 4;
}

message SetLocationSettingsRequest {
    string           profile_id = 1;
    LocationSettings settings   = 2;
}

// Presence and discoverability (#661); every flag is on by default. Teens
// (13–17) start unfindable by phone, email and suggestions. Honoured today:
// by_handle_search (search), activity_status and read_receipts (chat). Phone /
// email lookup, QR and suggestions have no server surface yet.
message DiscoverySettings {
    bool activity_status  = 1;
    bool read_receipts    = 2;
    bool by_phone         = 3;
    bool by_email         = 4;
    bool by_handle_search = 5;
    // Reachable through a QR code or a shared profile link.
    bool by_qr            = 6;
    bool in_suggestions   = 7;
}

// An unset flag keeps its value.
message SetDiscoverySettingsRequest {
    string        profile_id       = 1;
    optional bool activity_status  = 2;
    optional bool read_receipts    = 3;
    optional bool by_phone         = 4;
    optional bool by_email         = 5;
    optional bool by_handle_search = 6;
    optional bool by_qr            = 7;
    optional bool in_suggestions   = 8;
}

// What the owner hides from the comments on their posts (#660): hidden words
// (words, phrases or emoji, case-insensitive; ≤ 200, each ≤ 64 chars) and the
// offensive-comment filter (on by default). A matching comment is seen only by
// its author.
message CommentFilters {
    repeated string hidden_words     = 1;
    bool            filter_offensive = 2;
}

// Replaces the hidden words and sets the offensive filter.
message SetCommentFiltersRequest {
    string         profile_id = 1;
    CommentFilters filters    = 2;
}

// How far back others see the profile's posts and which tabs they see (#664).
// Older posts are hidden from everyone but the owner, never deleted. Saved is
// private by default. Only the window is enforced today (post); no likes,
// saved, reposts or places tab is served yet.
message TabSettings {
    PostWindow post_window  = 1;
    bool       show_likes   = 2;
    bool       show_saved   = 3;
    bool       show_reposts = 4;
    bool       show_places  = 5;
}

// An unset field (UNSPECIFIED window) keeps its value.
message SetTabSettingsRequest {
    string        profile_id   = 1;
    PostWindow    post_window  = 2;
    optional bool show_likes   = 3;
    optional bool show_saved   = 4;
    optional bool show_reposts = 5;
    optional bool show_places  = 6;
}

// Feed controls (#662), synced across the holder's devices: the client sends
// the level as timeline's content_level (LESS → RESTRICTED, STANDARD →
// STANDARD), and non_personalized as GetDiscoveryFeed's non_personalized.
// Timeline never serves STANDARD to a guest or a 13–17 holder.
message FeedSettings {
    SensitiveContent sensitive_content = 1;
    // For You not ranked by the profile's interest tags, and none learnt (DSA
    // Art. 38). Announced to timeline, which enforces it. On by default for a
    // 13–17 holder, who may turn it off.
    bool             non_personalized  = 2;
}

message SetFeedSettingsRequest {
    string       profile_id = 1;
    FeedSettings settings   = 2;
}

// ── Account type and verification requests (#668) ───────────────────────────

// A brand (business) profile's public contact card.
message BusinessInfo {
    // E.g. "Restaurant" (1–64 chars).
    string category      = 1;
    string contact_email = 2;
    string contact_phone = 3;
}

// Switch between PERSONAL, PROFESSIONAL (creator) and BRAND (business); BOT
// can be neither set nor left. `business` applies to BRAND only.
message SetAccountTypeRequest {
    string       profile_id = 1;
    ProfileKind  kind       = 2;
    BusinessInfo business   = 3;
}

enum VerificationRequestStatus {
    VERIFICATION_REQUEST_STATUS_UNSPECIFIED = 0;
    VERIFICATION_REQUEST_STATUS_PENDING     = 1;
    VERIFICATION_REQUEST_STATUS_APPROVED    = 2;
    VERIFICATION_REQUEST_STATUS_REJECTED    = 3;
}

message VerificationRequestView {
    string                    profile_id      = 1;
    VerificationKind          category        = 2;
    // `https://` links.
    repeated string           documents       = 3;
    VerificationRequestStatus status          = 4;
    // Why it was rejected.
    string                    reason          = 5;
    int64                     submitted_at_ms = 6;
    int64                     decided_at_ms   = 7;
    // Media asset ids of the requester's private documents (#777); staff read
    // them through media's mesh-only `GetPrivateDocumentUrl`.
    repeated string           private_document_ids = 8;
}

// Ask for a badge with 1–5 pieces of evidence in all: `https://` links and/or
// private documents (#777). PRF-5001 if already verified, PRF-5002 if a request
// is pending, PRF-9001 if a link is not `https://` (or the count is not 1–5),
// PRF-5004 if a private document is not the caller's own ready
// `MEDIA_KIND_PRIVATE_DOCUMENT`, PRF-5005 (retryable) if media cannot be asked.
message RequestVerificationRequest {
    string           profile_id = 1;
    VerificationKind category   = 2;
    // `https://` links (≤ 512 characters each).
    repeated string  documents  = 3;
    // Media asset ids of `MEDIA_KIND_PRIVATE_DOCUMENT` uploads, READY. Kept
    // 30 days after the decision, then purged by media.
    repeated string  private_document_ids = 4;
}

message GetVerificationRequestRequest {
    string profile_id = 1;
}

// `request` unset: the profile never asked.
message GetVerificationRequestResponse {
    VerificationRequestView request = 1;
}

// Staff (mesh-only): the pending requests, oldest first.
message ListPendingVerificationRequestsRequest {
    int32  limit      = 1;
    string page_token = 2;
}

message ListPendingVerificationRequestsResponse {
    repeated VerificationRequestView requests        = 1;
    string                           next_page_token = 2;
}

// Staff (mesh-only): approve (verifies the profile) or reject (with a reason
// the owner sees). PRF-5003 if nothing is pending.
message DecideVerificationRequestRequest {
    string profile_id = 1;
    bool   approve    = 2;
    string reason     = 3;
}

// ── Share tokens (#661) ───────────────────────────────────────────────────────

message GetShareTokenRequest {
    string profile_id = 1;
}

message RotateShareTokenRequest {
    string profile_id = 1;
}

message ShareTokenResponse {
    // 22 URL-safe characters; the app builds the QR code / link around it.
    string token = 1;
}

message ResolveShareTokenRequest {
    string token = 1;
}
