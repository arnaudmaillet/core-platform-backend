syntax = "proto3";

package profile.v1;

import "profile/v1/messages.proto";

option java_package = "com.coreplatform.profile.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/profile/v1;profilev1";

// ProfileService manages public-facing identity metadata.
//
// SRP guarantee: this service owns only profile metadata (handles, bios,
// avatars). Social graph concerns (followers, friends) belong to a separate
// bounded context and must never be added here.
//
// All mutating RPCs (commands) return CommandResponse.
// All read RPCs (queries) return the typed view message.
service ProfileService {

    // ── Profile lifecycle ─────────────────────────────────────────────────────

    // Create a new public profile linked to an account.
    // One account can own multiple profiles (1-to-N relationship), one per
    // profile slot (#916): every account has one free, more are bought
    // (BuyProfileSlot). With every slot in use nothing is created and the
    // response says so in-band: `success = false`, `no_free_slot = true`.
    rpc CreateProfile(CreateProfileRequest) returns (CommandResponse);

    // Update mutable profile metadata: bio, display_name, website, links, locale.
    rpc UpdateProfile(UpdateProfileRequest) returns (CommandResponse);

    // Atomically swap the public @handle using ScyllaDB LWT.
    // The old handle enters a 30-day tombstone reservation period.
    // A gem sink (#911): an account's first handle change is free, later ones
    // cost gems (server policy, GetHandleChangePrice), charged once and only
    // when the new handle is claimed. A caller who may not spend gems (under
    // 18, or age unknown) changes for free once per 30 days. Refusals are
    // in-band (`CommandResponse.handle_change`: PRICE_CHANGED,
    // INSUFFICIENT_GEMS, COOLDOWN; nothing changed, nothing charged). Asking
    // for the profile's current handle changes nothing.
    rpc ChangeHandle(ChangeHandleRequest) returns (CommandResponse);

    // What the profile's next handle change costs its account (#911): the
    // price (0 when free), and for a caller who may not spend gems when the
    // next free change opens. Edge: the profile's owner.
    rpc GetHandleChangePrice(GetHandleChangePriceRequest) returns (HandleChangePrice);

    // Replace the avatar CDN URL.
    rpc UpdateAvatar(UpdateAvatarRequest) returns (CommandResponse);

    // Replace the banner CDN URL.
    // An animated banner (#915, #947): `banner_asset_id` alone names a READY
    // VIDEO asset of the profile's account (one of its posts' videos), for an
    // account owning the `banner.animated` catalogue item (wallet). Reads then
    // carry `ProfileView.banner` with the video's MANIFEST (the loop) and
    // POSTER renditions, and `banner_url` is the poster. The server neither
    // trims nor caps the video: it is the post's own; the app plays it muted,
    // looping, and shows the poster under Reduce Motion, Low Power Mode and
    // when idle. PRF-5007 (FAILED_PRECONDITION) for an asset that is not the
    // account's READY video; PRF-6007 (PERMISSION_DENIED) without the item.
    rpc UpdateBanner(UpdateBannerRequest) returns (CommandResponse);

    // Wears an avatar frame, or none (#913): a catalogue item the profile's
    // account owns (bought with wallet PurchaseItem), equipped per profile;
    // every read of the profile then carries `avatar_frame_id`. PRF-6007
    // (PERMISSION_DENIED) for a frame the account does not own; PRF-6003
    // (UNAVAILABLE) when the wallet cannot tell. Edge: the profile's owner.
    rpc EquipAvatarFrame(EquipAvatarFrameRequest) returns (CommandResponse);

    // Picks the badges the profile shows (#912): in order, at most three,
    // each one its account earned (wallet ListOwnedItems, family BADGE);
    // every read then carries them (`ProfileView.badges`). PRF-6007
    // (PERMISSION_DENIED) for a badge the account has not earned; PRF-9001
    // for more than three or a repeat. Edge: the profile's owner.
    rpc SetBadgeShowcase(SetBadgeShowcaseRequest) returns (CommandResponse);

    // Toggle profile visibility between Public and Private.
    rpc SetVisibility(SetVisibilityRequest) returns (CommandResponse);

    // Who may comment / mention / message this profile, downloads, like counts.
    rpc SetInteractionSettings(SetInteractionSettingsRequest) returns (CommandResponse);

    // A temporary interaction limit (#669): hold comments and messages from
    // non-followers / recent followers until a time (owner only).
    rpc SetInteractionLimit(SetInteractionLimitRequest) returns (CommandResponse);
    rpc ClearInteractionLimit(ClearInteractionLimitRequest) returns (CommandResponse);

    // Ghost mode and location precision (owner only).
    rpc SetLocationSettings(SetLocationSettingsRequest) returns (CommandResponse);

    // Activity status, read receipts and how people can find this profile
    // (owner only).
    rpc SetDiscoverySettings(SetDiscoverySettingsRequest) returns (CommandResponse);

    // Hidden words and the offensive-comment filter (owner only).
    rpc SetCommentFilters(SetCommentFiltersRequest) returns (CommandResponse);

    // Post history window and tab visibility (owner only).
    rpc SetTabSettings(SetTabSettingsRequest) returns (CommandResponse);

    // Feed controls: the sensitive-content level (owner only).
    rpc SetFeedSettings(SetFeedSettingsRequest) returns (CommandResponse);

    // Account type: personal / professional (creator) / brand (business),
    // with a brand's public contact card (owner only).
    rpc SetAccountType(SetAccountTypeRequest) returns (CommandResponse);

    // Verification requests: the owner asks and follows its status; staff
    // (mesh-only) list the pending ones and decide.
    rpc RequestVerification(RequestVerificationRequest) returns (CommandResponse);
    rpc GetVerificationRequest(GetVerificationRequestRequest) returns (GetVerificationRequestResponse);
    rpc ListPendingVerificationRequests(ListPendingVerificationRequestsRequest) returns (ListPendingVerificationRequestsResponse);
    rpc DecideVerificationRequest(DecideVerificationRequestRequest) returns (CommandResponse);

    // Grant a platform verification badge (admin only).
    rpc VerifyProfile(VerifyProfileRequest) returns (CommandResponse);

    // Reactively mask a profile in response to an account lifecycle event.
    // Called internally by the Kafka account event consumer.
    rpc HideProfile(HideProfileRequest) returns (CommandResponse);

    // Restore a previously hidden or suspended profile to Active.
    rpc RestoreProfile(RestoreProfileRequest) returns (CommandResponse);

    // Soft-delete a profile. The handle enters the tombstone reservation period.
    rpc DeleteProfile(DeleteProfileRequest) returns (CommandResponse);

    // ── Queries ───────────────────────────────────────────────────────────────

    // Fetch the full profile view by primary key (cache-aside).
    rpc GetProfileById(GetProfileByIdRequest) returns (ProfileView);

    // Resolve a @handle to its full profile view (cache-aside, two hops).
    rpc GetProfileByHandle(GetProfileByHandleRequest) returns (ProfileView);

    // Whether a @handle can be taken right now (sign-up's live check; guests
    // and members). Normalized like CreateProfile does (lower-cased); a taken
    // handle includes one released less than 30 days ago. Advisory: the claim at
    // CreateProfile is what reserves it.
    rpc CheckHandleAvailability(CheckHandleAvailabilityRequest) returns (CheckHandleAvailabilityResponse);

    // Paginated list of all profiles owned by an account.
    rpc ListProfilesByAccount(ListProfilesByAccountRequest) returns (ListProfilesByAccountResponse);

    // A profile's QR code / share link (#661): a random token, revocable,
    // independent of the handle. The owner gets theirs (issued on first ask)
    // and rotates it — the old one stops resolving at once.
    rpc GetShareToken(GetShareTokenRequest) returns (ShareTokenResponse);
    rpc RotateShareToken(RotateShareTokenRequest) returns (ShareTokenResponse);
    // Anyone resolves a scanned token to the profile, as they may see it —
    // NOT_FOUND for a malformed or revoked token, a profile that is not
    // active, or one whose owner turned "reachable by QR / shared link" off.
    rpc ResolveShareToken(ResolveShareTokenRequest) returns (ProfileView);

    // ── Profile slots (#916) ──────────────────────────────────────────────────

    // The caller's account's profile slots: owned, in use, the cap and the
    // next slot's price (server policy: 100 / 200 / 400 / 800 gems for the
    // 2nd to the 5th). A slot is kept for good: deleting a profile frees it.
    // An account holding more profiles than slots from before keeps them.
    // Edge: the caller's account.
    rpc GetProfileSlots(GetProfileSlotsRequest) returns (ProfileSlots);

    // Buys the account's next profile slot with gems, at the price the app
    // showed: answered in-band (BOUGHT, MAX_REACHED, INSUFFICIENT_GEMS,
    // PRICE_CHANGED). Each slot is charged at most once, whatever the retries.
    // PRF-6002 (PERMISSION_DENIED) under 18 or with an unknown age (a minor
    // keeps one profile); PRF-6003 (UNAVAILABLE) when the wallet cannot
    // answer. Edge: the caller's account.
    rpc BuyProfileSlot(BuyProfileSlotRequest) returns (BuyProfileSlotResponse);
}
