syntax = "proto3";

package profile.v1;

option java_package = "com.coreplatform.profile.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/profile/v1;profilev1";

enum ProfileStatus {
    PROFILE_STATUS_UNSPECIFIED = 0;
    PROFILE_STATUS_ACTIVE      = 1;
    PROFILE_STATUS_SUSPENDED   = 2;
    PROFILE_STATUS_HIDDEN      = 3;
    PROFILE_STATUS_DELETED     = 4;
}

enum ProfileKind {
    PROFILE_KIND_UNSPECIFIED   = 0;
    PROFILE_KIND_PERSONAL      = 1;
    PROFILE_KIND_PROFESSIONAL  = 2;
    PROFILE_KIND_BRAND         = 3;
    PROFILE_KIND_BOT           = 4;
}

enum ProfileVisibility {
    PROFILE_VISIBILITY_UNSPECIFIED = 0;
    PROFILE_VISIBILITY_PUBLIC      = 1;
    PROFILE_VISIBILITY_PRIVATE     = 2;
}

enum VerificationKind {
    VERIFICATION_KIND_UNSPECIFIED = 0;
    VERIFICATION_KIND_OFFICIAL    = 1;
    VERIFICATION_KIND_NOTABLE     = 2;
    VERIFICATION_KIND_BUSINESS    = 3;
}

enum MaskingReason {
    MASKING_REASON_UNSPECIFIED         = 0;
    MASKING_REASON_ACCOUNT_SUSPENDED   = 1;
    MASKING_REASON_ACCOUNT_DELETED     = 2;
    MASKING_REASON_CONTENT_POLICY      = 3;
}

// Whether a handle can be taken.
enum HandleAvailability {
    HANDLE_AVAILABILITY_UNSPECIFIED = 0;
    HANDLE_AVAILABILITY_AVAILABLE   = 1;
    // Fails the handle rules (2–30 of [a-z0-9._], alphanumeric ends, no "..").
    HANDLE_AVAILABILITY_INVALID     = 2;
    // In use, or released less than 30 days ago.
    HANDLE_AVAILABILITY_TAKEN       = 3;
}

// Who may interact with a profile in a given way (enforced server-side through
// social-graph's CheckInteraction; a block always wins).
enum InteractionAudience {
    INTERACTION_AUDIENCE_UNSPECIFIED = 0;
    INTERACTION_AUDIENCE_EVERYONE    = 1;
    INTERACTION_AUDIENCE_FOLLOWERS   = 2;
    // Profiles this one follows back.
    INTERACTION_AUDIENCE_MUTUALS     = 3;
    INTERACTION_AUDIENCE_NO_ONE      = 4;
}
