syntax = "proto3";

package auth.v1;

import "auth/v1/messages.proto";

option java_package = "com.coreplatform.auth.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/auth/v1;authv1";

// AuthService is the platform's issuance / session / IdP-broker boundary. It
// brokers authentication to an external IdP, tracks the resulting session, mints
// short-lived edge tokens, and revokes them.
//
// IdP-agnosticism is a hard contract: this surface exposes only NORMALIZED
// identity types (account_id, session_id, generation, permissions). No
// Keycloak/Cognito/Okta-specific field appears here — migrating IdP is an
// infrastructure-adapter swap with zero change to this contract.
//
// Identity records (who a person is) are owned by AccountService; credentials
// (passwords/MFA) are owned by the IdP. This service owns the authentication act
// and its lifecycle only.
//
// Token model: `access_token` is verified LOCALLY by downstream services via the
// `auth-context` library (pure CPU, no call to this service on the hot path);
// `refresh_token` is opaque, single-use, and rotated on every Refresh.
service AuthService {

    // ── Session establishment ─────────────────────────────────────────────────

    // Broker credentials/authorization-code to the IdP, establish a session, and
    // return an edge access token + opaque refresh token. Resolves (or, on first
    // login, creates) the IdP-subject → account link and gates issuance on the
    // account being active. With two-step sign-in on (#649) no session is
    // issued yet: the response carries `mfa_required` and an `mfa_token`, and
    // CompleteLogin finishes the sign-in.
    rpc Login(LoginRequest) returns (LoginResponse);

    // The second step of a sign-in (#649): the code from the holder's
    // authenticator app, or one of their backup codes, for the `mfa_token`
    // Login returned. Issues the session (once). A wrong code is AUT-5017
    // (UNAUTHENTICATED; the challenge stays usable until it expires); five
    // wrong codes in 15 minutes lock the account's codes (AUT-5018,
    // RESOURCE_EXHAUSTED, `retry-after-secs`); an unknown, expired or used
    // token is AUT-5021 (sign in again).
    rpc CompleteLogin(CompleteLoginRequest) returns (LoginResponse);

    // Rotate the refresh token (single-use) and mint a fresh edge token. Reusing
    // an already-rotated refresh token is treated as compromise and revokes the
    // entire session generation.
    rpc Refresh(RefreshRequest) returns (RefreshResponse);

    // Creates an account from a native Sign in with Apple / Google id_token,
    // with the date of birth, the consent and the home country, and opens a
    // member session (edge: public). Returns `existing_account` instead when
    // the identity, or its verified email, already has one.
    rpc SignUp(SignUpRequest) returns (SignUpResponse);

    // Sends a one-time code to an email address or by SMS (edge: public), for a
    // passwordless SignUp or Login with `verification_code`. Rate-limited per
    // address / number (RESOURCE_EXHAUSTED with `retry-after-secs`).
    rpc StartVerification(StartVerificationRequest) returns (StartVerificationResponse);

    // A single-use nonce for a native Sign in with Apple / Google (edge:
    // public). The app passes it (Apple: its SHA-256 hex) to the provider, then
    // the raw value in `IdTokenGrant.nonce`: SignUp / Login consume it, so an
    // id_token cannot be replayed within its lifetime.
    rpc StartFederatedSignIn(StartFederatedSignInRequest) returns (StartFederatedSignInResponse);

    // A single-use challenge for App Attest (edge: public): the app attests a
    // fresh Secure Enclave key for it, then presents the attestation to
    // StartGuestSession.
    rpc StartDeviceAttestation(StartDeviceAttestationRequest) returns (StartDeviceAttestationResponse);

    // Start an anonymous GUEST session for an app installation (guest mode:
    // browse before sign-up). No account is created. The edge token carries
    // sub = "guest:<guest_id>", kind = "guest", perms = ["read:public"], no
    // profiles, and the installation's device id (`did`); it is refreshed with
    // Refresh. The client edge refuses a guest token on every `authenticated`
    // method: guests only read public content. With App Attest enforced, the
    // request must carry a valid attestation (PERMISSION_DENIED otherwise).
    rpc StartGuestSession(StartGuestSessionRequest) returns (StartGuestSessionResponse);

    // ── Revocation ────────────────────────────────────────────────────────────

    // Revoke a single session (the caller's current one by default). Idempotent.
    rpc Logout(LogoutRequest) returns (LogoutResponse);

    // Global sign-out: bump the account's session generation so every previously
    // minted edge token is rejected at the edge within one cache read.
    rpc LogoutAllSessions(LogoutAllSessionsRequest) returns (LogoutAllSessionsResponse);

    // ── Credentials (the signed-in holder, client edge) ───────────────────────

    // Change the password the holder signs in with: the current password is
    // proved with the IdP, then the new one is set there (it never crosses into
    // account or auth storage). Optionally signs every other session out; the
    // caller's own stays. A weak or refused new password fails with
    // FAILED_PRECONDITION: AUT-VAL-024/025/026 (length, unchanged) or AUT-5006
    // (the IdP's password policy, its rule in the message). A wrong current
    // password is UNAUTHENTICATED (AUT-5002).
    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

    // Step-up: re-prove a credential before a destructive action. Returns a
    // fresh access token for the caller's session whose `auth_time` claim is
    // now; step-up-gated RPCs (account deletion and deactivation, contact
    // changes…) accept it for step_up_expires_in seconds and otherwise answer
    // PERMISSION_DENIED "step_up_required…". The refresh token is unchanged.
    rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse);

    // Change the caller's email or phone (#651) to the address a
    // StartVerification code proved (send the code there first). Needs a recent
    // credential proof (VerifyCredentials), like any takeover-prone action.
    // Everything that signs the holder in follows: the account, the password
    // account's IdP email, the passwordless code sign-in. The address on file
    // before is told. Another account's address: AUT-6006 / AUT-6007.
    rpc ChangeContact(ChangeContactRequest) returns (ChangeContactResponse);

    // ── Two-step sign-in settings (#649) ──────────────────────────────────────

    // Start turning two-step sign-in on: a new seed for the holder's
    // authenticator app (the `otpauth://` URI for a QR code, or the secret to
    // type), kept until its first code confirms it (10 minutes; starting again
    // replaces it). Needs a recent credential proof. AUT-5022 when already on.
    rpc StartMfaEnrollment(StartMfaEnrollmentRequest) returns (StartMfaEnrollmentResponse);

    // The first code from the authenticator app: two-step sign-in is on, the
    // backup codes are returned — shown once, never again — and the account's
    // other sessions are signed out. The account's email is told. A wrong
    // code is AUT-5017; no enrolment waiting (expired, or never started) is
    // AUT-5021.
    rpc ConfirmMfaEnrollment(ConfirmMfaEnrollmentRequest) returns (BackupCodesResponse);

    // Turn two-step sign-in off. Needs a recent credential proof; the
    // account's email is told. AUT-5020 when already off.
    rpc DisableMfa(DisableMfaRequest) returns (DisableMfaResponse);

    // A new set of backup codes (shown once; the old ones stop working); the
    // other sessions are signed out. Needs a recent credential proof; the
    // account's email is told. AUT-5020 when two-step sign-in is off.
    rpc RegenerateBackupCodes(RegenerateBackupCodesRequest) returns (BackupCodesResponse);

    // ── Passkeys (#808) ───────────────────────────────────────────────────────
    // WebAuthn credentials (ES256, discoverable, user verification required,
    // no attestation) bound to AUTH_WEBAUTHN_RP_ID. Without it configured
    // every passkey RPC is UNAVAILABLE.

    // Start registering a passkey: the options for the platform authenticator
    // (challenge single use, 5 minutes, bound to the caller's account). Needs
    // a recent credential proof. AUT-5025 when the account holds 10.
    rpc StartPasskeyRegistration(StartPasskeyRegistrationRequest) returns (PasskeyRegistrationOptions);

    // The authenticator's response: verified (challenge, origin, RP id, user
    // verification, ES256 key) and stored. The account's email is told.
    // AUT-5023 bad / used / expired challenge; AUT-5024 not accepted;
    // AUT-5026 this authenticator's passkey is already registered.
    rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (Passkey);

    // The caller's passkeys, oldest first.
    rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);

    // Removes one of the caller's passkeys (it no longer signs in) and returns
    // those left. Needs a recent credential proof; the account's email is
    // told. AUT-5027 when the account has no such passkey.
    rpc RemovePasskey(RemovePasskeyRequest) returns (ListPasskeysResponse);

    // ── Introspection & device management ─────────────────────────────────────

    // INTERNAL. Server-side token introspection returning the normalized
    // principal, for callers that cannot verify edge tokens locally.
    rpc Introspect(IntrospectRequest) returns (IntrospectResponse);

    // List the account's active sessions for device-management UIs.
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}
