syntax = "proto3";

package auth.v1;

option java_package = "com.coreplatform.auth.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/auth/v1;authv1";

// Lifecycle status of a Session aggregate.
enum SessionStatus {
    SESSION_STATUS_UNSPECIFIED = 0;
    // Live; can mint edge access tokens until its sliding/absolute expiry.
    ACTIVE                     = 1;
    // Explicitly revoked (logout, reuse-detection, or admin). Terminal.
    REVOKED                    = 2;
    // Reached its absolute expiry. Terminal.
    EXPIRED                    = 3;
}

// How the caller authenticates at OUR boundary. Deliberately IdP-agnostic: the
// concrete IdP protocol (Keycloak/Cognito/Okta) is brokered behind the
// infrastructure adapter and never named in this contract.
enum GrantType {
    GRANT_TYPE_UNSPECIFIED = 0;
    // OIDC authorization-code flow with PKCE (primary, browser/native clients).
    AUTHORIZATION_CODE     = 1;
    // Resource-owner password grant — first-party trusted clients only. The
    // password transits TLS to the IdP broker and is NEVER stored by this service
    // (credentials are owned by the IdP under the federated model).
    PASSWORD               = 2;
    // A native Sign in with Apple / Google id_token, verified by this service
    // against the provider's keys (no IdP round-trip).
    ID_TOKEN               = 3;
    // A one-time code sent to an email address (StartVerification).
    VERIFICATION_CODE      = 4;
}

// Where a one-time code is sent.
enum VerificationChannel {
    VERIFICATION_CHANNEL_UNSPECIFIED = 0;
    VERIFICATION_CHANNEL_EMAIL       = 1;
    // A phone number (E.164), for phone-only accounts.
    VERIFICATION_CHANNEL_SMS         = 2;
}

// A third-party identity provider whose id_tokens this service verifies.
enum FederatedProvider {
    FEDERATED_PROVIDER_UNSPECIFIED = 0;
    FEDERATED_PROVIDER_APPLE       = 1;
    FEDERATED_PROVIDER_GOOGLE      = 2;
}

// How an existing account signs in (SignUp's "you already have an account").
enum SignInMethod {
    SIGN_IN_METHOD_UNSPECIFIED = 0;
    SIGN_IN_METHOD_APPLE       = 1;
    SIGN_IN_METHOD_GOOGLE      = 2;
    // Email / username + password (the IdP's own credential).
    SIGN_IN_METHOD_PASSWORD    = 3;
    // A one-time code sent to the email address (no password).
    SIGN_IN_METHOD_EMAIL_CODE  = 4;
    // A one-time code sent by SMS to the phone number (no password, no email).
    SIGN_IN_METHOD_PHONE_CODE  = 5;
}
