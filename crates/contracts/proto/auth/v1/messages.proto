syntax = "proto3";

package auth.v1;

import "auth/v1/enums.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.coreplatform.auth.v1";
option java_multiple_files = true;
option go_package = "github.com/coreplatform/auth/v1;authv1";

// ── Shared value objects ──────────────────────────────────────────────────────

// Client/device context captured for session tracking and anomaly detection.
// All fields are best-effort metadata; none are security-bearing on their own.
message DeviceContext {
    string  user_agent  = 1;
    string  ip_address  = 2;
    // Client-provided stable device identifier (optional); enables "this device"
    // labelling and targeted revocation in ListSessions.
    string  device_id   = 3;
}

// The pair of tokens returned on a successful Login/Refresh.
//
// `access_token` is the short-lived, locally-verifiable EDGE token (ES256 JWT in
// the current phase; PASETO v4.public is a forward-compatible swap). Downstream
// services verify it in pure CPU via the `auth-context` library — they do NOT
// call this service on the hot path.
//
// `refresh_token` is a long-lived, opaque, single-use server-side handle. It is
// rotated on every use; presenting a rotated token triggers reuse-detection and
// revokes the whole session generation.
message TokenPair {
    string  access_token   = 1;
    string  refresh_token  = 2;
    // Always "Bearer"; present for OAuth2 client familiarity.
    string  token_type     = 3;
    // Lifetime of `access_token` in seconds (always ⊆ remaining session TTL).
    int64   expires_in     = 4;
    // The session this pair belongs to (normalized identifier).
    string  session_id     = 5;
}

// A single session as seen by the account owner (device-management view).
message SessionView {
    string                          session_id       = 1;
    SessionStatus                   status           = 2;
    // Monotonic revocation epoch; a mass-logout bumps it.
    int64                           generation       = 3;
    DeviceContext                   device           = 4;
    google.protobuf.Timestamp       issued_at        = 5;
    // Sliding expiry of the session.
    google.protobuf.Timestamp       expires_at       = 6;
    // Hard cap beyond which the session cannot be extended.
    google.protobuf.Timestamp       absolute_expiry  = 7;
    // True for the session that issued the calling principal's token.
    bool                            current          = 8;
}

// ── Login ─────────────────────────────────────────────────────────────────────

// OIDC authorization-code grant (with PKCE). The code is obtained by the client
// from the IdP's authorize endpoint; this service exchanges it via the broker.
message AuthorizationCodeGrant {
    string  code           = 1;
    string  redirect_uri   = 2;
    // PKCE verifier matching the challenge sent to the authorize endpoint.
    string  code_verifier  = 3;
}

// Resource-owner password grant (first-party trusted clients only).
message PasswordGrant {
    string  username  = 1;
    // Transits TLS to the IdP broker; never persisted by this service.
    string  password  = 2;
}

// A native Sign in with Apple / Google id_token. Verified here against the
// provider's published keys: signature, issuer, audience (the app's client
// ids), expiry, and the nonce.
message IdTokenGrant {
    FederatedProvider   provider  = 1;
    string              id_token  = 2;
    // The raw nonce the app generated for this sign-in. The token's `nonce`
    // claim must equal it, or its SHA-256 hex (what the app passes to Apple).
    string              nonce     = 3;
}

// A one-time code from StartVerification, proving control of the address.
message VerificationCodeGrant {
    string  challenge_id  = 1;
    string  code          = 2;
}

message LoginRequest {
    DeviceContext   device  = 1;
    GrantType       grant_type = 2;
    // Exactly one credential variant must be set, matching `grant_type`.
    oneof credential {
        AuthorizationCodeGrant  authorization_code  = 3;
        PasswordGrant           password            = 4;
        // An id_token whose identity has no account yet fails NOT_FOUND
        // (AUT-6004): the app goes on with SignUp.
        IdTokenGrant            id_token            = 5;
        // A code sent to the account's email address (passwordless accounts).
        // An address with no such account fails NOT_FOUND (AUT-6004): SignUp.
        VerificationCodeGrant   verification_code   = 7;
    }
    // Optional: the refresh token of the guest session this device was using.
    // A successful login ends that guest session (the guest becomes the member).
    string          guest_refresh_token = 6;
}

message LoginResponse {
    // Internal account identifier (NOT the IdP subject) the session is bound to.
    string      account_id  = 1;
    TokenPair   tokens      = 2;
    // True when this login established the IdP-subject → account link for the
    // first time (a SubjectLinked event was emitted).
    bool        first_link  = 3;
    // True when the account had been deactivated by its holder and this login
    // reactivated it (its profiles become visible again) — the app can welcome
    // the user back. A suspended account is never reactivated by a login.
    bool        reactivated = 4;
}

// ── Sign-up ───────────────────────────────────────────────────────────────────

// The consent given at sign-up (account's GDPR record).
message SignUpConsent {
    // The privacy-policy version shown (required).
    string  policy_version   = 1;
    // Required: true. Processing personal data is what the service needs.
    bool    data_processing  = 2;
    bool    marketing        = 3;
    bool    analytics        = 4;
}

message SignUpRequest {
    DeviceContext   device              = 1;
    // Exactly one of `id_token` (Sign in with Apple / Google) and
    // `verification_code` (an email address proven by a code).
    IdTokenGrant    id_token            = 2;
    VerificationCodeGrant verification_code = 7;
    // ISO 8601 (YYYY-MM-DD). Under the minimum age (13; 16 in some countries)
    // → FAILED_PRECONDITION AUT-6005, and nothing is created or kept.
    string          date_of_birth       = 3;
    SignUpConsent   consent             = 4;
    // ISO 3166-1 alpha-2: the current country (guest country access), else the
    // App Store storefront country. Becomes the account's home country.
    string          home_country        = 5;
    // Optional: the refresh token of the guest session this device was using;
    // it ends on success (the guest becomes the member).
    string          guest_refresh_token = 6;
}

message SignedUp {
    string      account_id  = 1;
    // A member session. The account has no profile yet: create it
    // (profile.CreateProfile), then Refresh so the token's `pids` carry it.
    TokenPair   tokens      = 2;
}

// The identity has an account already (the same Apple / Google account, or
// its verified email under another method): sign in with that method instead.
// Apple private-relay addresses never match.
message ExistingAccount {
    SignInMethod    method  = 1;
}

message SignUpResponse {
    oneof outcome {
        SignedUp        signed_up         = 1;
        ExistingAccount existing_account  = 2;
    }
}

// ── One-time codes ────────────────────────────────────────────────────────────

// Sends a one-time code to an address, for SignUp or Login. The answer is the
// same whether or not the address has an account (nothing to enumerate); what
// the address leads to is only told to whoever enters the code.
message StartVerificationRequest {
    VerificationChannel channel     = 1;
    // An email address (EMAIL).
    string              destination = 2;
    // BCP-47, for the message's language.
    string              locale      = 3;
    DeviceContext       device      = 4;
}

message StartVerificationResponse {
    string  challenge_id       = 1;
    // The code expires after this many seconds (and after 5 wrong tries).
    int64   expires_in_secs    = 2;
    // A new code for the same address can be asked for after this many seconds.
    int64   resend_after_secs  = 3;
}

// ── Refresh ───────────────────────────────────────────────────────────────────

message RefreshRequest {
    string          refresh_token  = 1;
    // Optional; re-validated against the session's bound device when present.
    DeviceContext   device         = 2;
}

message RefreshResponse {
    TokenPair   tokens  = 1;
}

// ── Guest session ─────────────────────────────────────────────────────────────

message StartGuestSessionRequest {
    // Required: device_id identifies the installation (the token's `did`; the
    // welcome gift is once per device).
    DeviceContext   device          = 1;
    // App Attest assertion (DeviceCheck fallback). Recorded; verified by the
    // abuse controls.
    string          attestation     = 2;
    // BCP-47, e.g. "fr-FR".
    string          locale          = 3;
    // Store country, a discovery hint.
    string          region_hint     = 4;
    // ISO 3166-1 alpha-2 country derived on the device from location, when the
    // user allowed it. Never a coordinate.
    string          current_country = 5;
}

message StartGuestSessionResponse {
    string      guest_id    = 1;
    TokenPair   tokens      = 2;
}

// ── Logout ────────────────────────────────────────────────────────────────────

message LogoutRequest {
    // Session to revoke. Empty ⇒ the calling principal's current session
    // (resolved from the authenticated edge token).
    string  session_id  = 1;
}

message LogoutResponse {
    bool    success  = 1;
}

// ── Logout all sessions (global sign-out / generation bump) ───────────────────

message LogoutAllSessionsRequest {
    // Target account. Empty ⇒ the calling principal's account.
    string  account_id  = 1;
}

message LogoutAllSessionsResponse {
    bool    success           = 1;
    // The new session generation after the bump; every token below it is dead.
    int64   generation        = 2;
    int32   sessions_revoked  = 3;
}

// ── Introspect (internal) ─────────────────────────────────────────────────────

message IntrospectRequest {
    string  access_token  = 1;
}

// Normalized principal — the same shape `auth-context` produces on the inbound
// path, exposed here for callers that need server-side introspection rather than
// local verification (e.g. opaque-token gateways or audit tooling).
message IntrospectResponse {
    bool                            active       = 1;
    string                          account_id   = 2;
    string                          session_id   = 3;
    int64                           generation   = 4;
    // Normalized permissions, e.g. "posts:write" / "ROLE_ADMIN".
    repeated string                 permissions  = 5;
    google.protobuf.Timestamp       expires_at   = 6;
}

// ── List sessions ─────────────────────────────────────────────────────────────

message ListSessionsRequest {
    // Target account. Empty ⇒ the calling principal's account.
    string  account_id  = 1;
}

message ListSessionsResponse {
    repeated SessionView  sessions  = 1;
}

// ── Credentials ───────────────────────────────────────────────────────────────

message ChangePasswordRequest {
    string  current_password         = 1;
    // 8–128 characters, different from the current one; the IdP's password
    // policy may ask for more.
    string  new_password             = 2;
    // Sign every other session of the account out (recommended).
    bool    sign_out_other_sessions  = 3;
}

message ChangePasswordResponse {
    // Other sessions signed out (0 unless asked).
    int32   sessions_revoked  = 1;
}

message VerifyCredentialsRequest {
    oneof credential {
        string  password  = 1;
        // A TOTP or backup code. Refused (AUT-5007) until MFA enrolment exists.
        string  mfa_code  = 2;
    }
}

message VerifyCredentialsResponse {
    // Replaces the caller's access token; carries `auth_time` = now.
    string  access_token        = 1;
    int64   expires_in          = 2;
    // How long step-up-gated RPCs accept this proof.
    int64   step_up_expires_in  = 3;
}
