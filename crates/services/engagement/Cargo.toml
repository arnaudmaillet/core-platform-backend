[package]
name        = "engagement"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
authors.workspace   = true
repository.workspace = true
description = "Engagement microservice — likes (the wallet's stakes, #665) and view/share/comment counters, Redis-primary with ScyllaDB durable copies."

[dependencies]
engagement-api = { workspace = true }
post-api       = { workspace = true }   # BatchGetLikeVisibility client (#809)
social-graph-api = { workspace = true }   # CheckAccess: who may see a profile's Likes tab (#829)
error          = { workspace = true }
validate-core  = { workspace = true }
validation     = { workspace = true }
scylla-storage = { workspace = true }
redis-storage  = { workspace = true }
cqrs           = { workspace = true }
transport      = { workspace = true }
service-runtime = { workspace = true }
anyhow         = { workspace = true }

tokio        = { workspace = true }
futures      = { workspace = true }   # likes: per-target reads in parallel (#665)
async-trait  = { workspace = true }
serde        = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
dashmap      = { workspace = true }

tonic            = { workspace = true }
tonic-health     = { workspace = true }
tonic-reflection = { workspace = true }
http             = { workspace = true }
prost-types      = { workspace = true }   # AccountLikeView.liked_at (#665)

scylla = { workspace = true }
fred   = { workspace = true, features = ["partial-tracing", "i-scripts"] }

[features]
# Gates the live, container-backed integration suite (tests/integration.rs).
# Off by default so `cargo test -p engagement` stays a fast, infra-free unit run;
# the live suite is opt-in via
# `cargo test -p engagement --features integration-engagement`.
integration-engagement = []

[dev-dependencies]
tokio = { workspace = true }
# Wire-contract test: StakeCommitted read as the wallet serializes it (#665).
wallet     = { workspace = true }
# Wire-contract test: AccountDeleted read as account serializes it (#665).
account    = { workspace = true }
serde_json = { workspace = true }

# ── Integration suite (feature = "integration-engagement") ───────────────────
# Container orchestration and `await_until` come from the shared `test-support`
# crate; the Redis-primary hot path needs only Redis (no ScyllaDB/Kafka). The
# suite code is wholly behind `#[cfg(feature = "integration-engagement")]`.
test-support = { workspace = true }
async-trait  = { workspace = true }
uuid         = { workspace = true }
