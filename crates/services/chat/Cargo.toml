[package]
name        = "chat"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
description = "Chat microservice — unified Conversation layer (Group mesh + Channel broadcast), the Shadowing Pattern separating the bounded Member Plane from the sharded Audience Plane, ScyllaDB time-bucketed message logs, and Redis Cluster real-time routing."

[dependencies]
chat-api = { workspace = true }
text-filter = { workspace = true }   # hidden words / offensive filter on message requests (#810)
social-graph-api = { workspace = true }   # CheckInteraction client (who may message whom, #656)
error          = { workspace = true }
validate-core  = { workspace = true }
validation     = { workspace = true }
scylla-storage = { workspace = true }
redis-storage  = { workspace = true }
cqrs           = { workspace = true }
transport      = { workspace = true }
service-runtime = { workspace = true }
infra-config   = { workspace = true }
anyhow         = { workspace = true }

tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
dashmap      = { workspace = true }

http   = { workspace = true }
scylla = { workspace = true }
fred   = { workspace = true, features = ["partial-tracing", "i-scripts"] }

tonic            = { workspace = true }
tonic-health     = { workspace = true }
tonic-reflection = { workspace = true }

[features]
# Gates the live, container-backed integration suite (tests/integration.rs).
# Off by default so `cargo test -p chat` stays a fast, infra-free unit run; the
# live suite is opt-in via `cargo test -p chat --features integration-chat`.
integration-chat = []

[dev-dependencies]
tokio = { workspace = true }
# Wire contract test of the presence-settings worker against profile's own type.
profile = { workspace = true }

# ── Integration suite (feature = "integration-chat") ─────────────────────────
# These are compiled for any `cargo test -p chat`, but the test code that uses
# them is wholly behind `#[cfg(feature = "integration-chat")]`, so without the
# feature the suite is an empty binary.
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true, features = ["scylladb", "redis", "kafka"] }
rdkafka                = { workspace = true }
futures                = { workspace = true }
uuid                   = { workspace = true }
chrono                 = { workspace = true }
tonic                  = { workspace = true }

test-support   = { workspace = true }
scylla-storage = { workspace = true }
redis-storage  = { workspace = true }
transport      = { workspace = true }
cqrs           = { workspace = true }
auth-context   = { workspace = true }
